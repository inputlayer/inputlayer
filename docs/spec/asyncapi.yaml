asyncapi: 3.0.0

info:
  title: InputLayer WebSocket API
  version: 2.1.0
  description: |
    WebSocket API for InputLayer Knowledge Graph Engine.

    The WebSocket endpoint at `/ws` is the primary API for all operations:
    knowledge graph management, query execution, data manipulation, rule management,
    and session-based ephemeral data. Sessions are auto-managed (created on connect,
    closed on disconnect).

    Interactive documentation is served at `/api/ws-docs`, and this spec is available
    as YAML at `/api/asyncapi.yaml`.

    ## Connection

    Connect to `ws://<host>:<port>/ws?kg=<name>&last_seq=<n>&epoch=<stream_epoch>` where
    `kg` is the initial knowledge graph to bind to (defaults to "default") and
    `last_seq` with `epoch` is an optional reconnect cursor for notification replay.

    ## Streams, epochs and revisions

    Change notifications and standing-query results are two separate streams.

    - Notifications are numbered by `seq`, strictly increasing in delivery order, within
      one *stream epoch*: an id of the engine run, sent as `stream_epoch` in
      `authenticated`. A restarted engine has a new epoch and numbers from 1 again. On
      reconnect, pass `last_seq` and `epoch`: the server replays the retained
      notifications after the cursor, then live ones, with nothing skipped or repeated.
      When it cannot (the cursor is from another engine run, names no epoch, is past the
      stream, or notifications after it were evicted from the bounded ring) it replays
      nothing and sends one `replay_gap` notice; re-read the state you track.
      Notifications are not a durable history.
    - A subscription's pushes are numbered by its own `seq` (from 1, without gaps) and
      name the knowledge graph `revision` they bring the result to. The `.subscribe`
      reply's `subscribed.revision` is the revision its snapshot is the exact answer at;
      every delta names a higher one. A commit published after the snapshot is never
      lost. Subscriptions are never resumed across connections: after a reconnect,
      subscribe again and start from the new snapshot. Revisions are comparable only
      within one knowledge graph and one stream epoch.

    After WebSocket upgrade, the client must authenticate before any other operation.
    Send a `login` message (username/password) or an `authenticate` message (API key).
    On success the server responds with `authenticated`; on failure with `auth_error`.
    The server closes the socket after 3 failed attempts, or if the client has not
    authenticated within `http.ws_auth_timeout_ms` (default 5 s). Repeated failed logins
    per IP (IPv6: per /64) or username are throttled with exponential backoff. A username's
    backoff does not apply from IPs it logged in from in the last 30 days; API-key
    authentication skips login backoff and is the recovery path for a locked-out account.

    ## Protocol version and request IDs

    This is protocol version 5, reported as `protocol_version` in `authenticated`.
    Version 4 added `execute.params`; an engine reporting less ignores them.
    Version 5 added snapshot reads (`read`) and subscription groups (`subscribe`).
    The frame types are defined once in the `inputlayer-ws-protocol` crate
    (`ws-protocol/`); the Python and JS SDKs mirror them.

    Any request (`login`, `authenticate`, `execute`, `read`, `subscribe`, `cancel`,
    `ping`) may carry an `id`: a non-empty string of at most 64 bytes. Every frame
    answering that request echoes it: `authenticated`, `auth_error`, `result`,
    `result_start`, `result_chunk`, `result_end`, `snapshot`, `snapshot_start`,
    `snapshot_chunk`, `snapshot_end`, `error`, `cancel_ack` and `pong`. A request without an `id` gets replies without one. An `id` must
    be unique among your requests still awaiting a reply; it may be reused once answered.
    A request reusing the `id` of an unanswered request gets an `invalid_request` error
    and does not run. Replies come back in request order (see Pipelining).

    Frames the client did not ask for never carry an `id` and have their own types, so
    they can never be mistaken for a reply:

    - pushes: change notifications (`persistent_update`, `rule_change`, `kg_change`,
      `schema_change`) and standing-query results (`subscription_delta`, its streamed
      form `subscription_delta_start` / `subscription_delta_chunk` /
      `subscription_delta_end`, for a subscription group `subscription_group_delta` and
      its streamed form `subscription_group_delta_start` /
      `subscription_group_delta_chunk` / `subscription_group_delta_end`, and
      `subscription_error` and `subscription_reset`), addressed by subscription name and
      generation;
    - `notice`: connection events such as an idle timeout, typed by `code`. Every code
      except `notifications_missed` and `replay_gap` is followed by the server closing
      the connection.

    A request that is not a valid frame (bad JSON, unknown `type`, missing field, or an
    `id` that is not a 1-64 byte string or is given twice) is answered by exactly one
    `error` with code `invalid_request`, carrying the `id` when it could be read; a
    request over the per-connection message rate gets code `rate_limited`. Neither runs,
    and the connection stays usable.

    ## Large payloads

    No frame exceeds the 16 MiB message limit. A result, or a `.subscribe` snapshot,
    whose single frame would exceed 1 MiB is streamed as `result_start`, `result_chunk`s
    and `result_end`; a `snapshot` (the reply to `read` and `subscribe`) as
    `snapshot_start`, `snapshot_chunk`s and `snapshot_end`; a subscription delta as
    `subscription_delta_start`, `subscription_delta_chunk`s and `subscription_delta_end`;
    a group delta as `subscription_group_delta_start`, `subscription_group_delta_chunk`s
    and `subscription_group_delta_end`. A chunk holds at most 500 rows and about 1 MiB;
    in a payload of several results (a snapshot, a group delta) each chunk holds rows of
    one result only, names it by index, and results stream in order. Each stream is one logical result or delta: apply it only at
    its end frame, after checking that the chunks arrived in order from `chunk_index` 0
    and add up to the end frame's counts. Until then the previous state stands. Frames
    of one stream arrive in order; other frames may arrive between them.

    What the server cannot deliver whole (a row larger than any frame) it reports
    instead, before sending any part: an `error` answering the request, or a
    `subscription_reset` that ends the subscription. An `error` with the request's `id`
    after `result_start` also ends that stream: discard its rows. A connection that
    closes mid-stream delivered nothing of that stream.

    The server writes one frame at a time. A client that leaves a frame unread for
    `http.ws_send_timeout_ms` (default 30 s) is disconnected, so a stalled reader holds
    no server resources and never delays other connections.

    ## Snapshot reads and subscription groups

    A caller that renders one state from several queries needs them all at the same
    revision. Two requests give that:

    - `read` runs several named queries on one pinned snapshot of the connection's
      knowledge graph and answers with one `snapshot`: every result is its query's exact
      answer at the snapshot's `revision`, whatever commits meanwhile. It sees persistent
      data only, as a subscription does (no session facts or rules), and fails as a
      whole, naming the failing query. It runs alongside other queries (see Pipelining)
      under the request's deadline and `cancel`, which stop every query of it.
    - `subscribe` registers a subscription *group*: several named queries kept current
      together, by re-evaluating them after each relevant commit and diffing the results. Its reply is a `snapshot` of every member at one revision (with
      `subscribed`). Afterwards the server pushes one `subscription_group_delta` per
      refresh that changed any member, listing every member in order, the ones whose
      result did not change marked `unchanged`; after applying it, every member is its
      query's exact answer at the push's `revision`. A refresh that changes no member
      pushes nothing. A refresh fails as a whole (`subscription_error`), every member
      keeping its last result. `seq` is gapless per group. End a group with
      `.unsubscribe <name>`; names are shared with `.subscribe`, and a group counts once
      per query against `http.rate_limit.ws_max_subscriptions`. Bursts of commits
      coalesce, as for any subscription: a row that appears and disappears between two
      refreshes is never seen.

    ## Message Flow

    1. Client connects → must authenticate first
    2. Client sends `login` or `authenticate` → Server responds with `authenticated` or `auth_error`
    3. If `last_seq` and `epoch` were provided, the server replays missed notifications or sends a `replay_gap` notice
    4. Client sends `execute` messages → Server responds with `result` or `error`, echoing the request `id`; `read` and `subscribe` are answered by `snapshot` or `error`
    5. For large results (>1 MB), the server streams: `result_start` → `result_chunk` (×N) → `result_end`
    6. Server may push change notifications (`persistent_update`, `rule_change`, ...), for `.subscribe`d queries `subscription_delta` (streamed when large), for subscription groups `subscription_group_delta` (streamed when large), `subscription_error` / `subscription_reset`, and connection `notice`s
    7. Client disconnects → Server auto-closes session

    ## Pipelining

    Clients may send requests without waiting for replies. Replies come back in
    request order. Programs made only of queries, and `read`s, run concurrently; any
    other request (writes, rules, session changes, `.kg use`, `.subscribe`,
    `subscribe`, ...) starts
    after every earlier request has replied and finishes before any later one
    starts. Pushes are delivered while requests run, between replies. At most
    `http.rate_limit.ws_max_in_flight_requests` (default 16) requests are
    unanswered at once; beyond that the server stops reading the connection.

    ## Deadlines and cancellation

    Every `execute` and `read` runs under one deadline that starts when the server reads it
    and covers waiting behind earlier requests, waiting for a compute slot and
    computing: `storage.performance.query_timeout_ms` (default 30 s), or the
    request's own `timeout_ms` when that is sooner.

    A `cancel` names an unanswered request by its `id` (`target`). It acts as
    soon as it is read, even while the target waits behind other requests, and
    is answered by `cancel_ack`, released in request order like any reply (so
    after the target's own reply). Its `outcome`:

    - `cancelled`: the target stopped before it began committing. Nothing it
      would have changed is applied, it never runs later, and it replies with
      an `error` of code `cancelled`.
    - `too_late`: the target already finished or began committing. A commit is
      never interrupted; the target's reply reports what it committed.
    - `not_found`: no unanswered request of this connection has that `id`.

    A request whose deadline passes is stopped the same way and fails with code
    `deadline_exceeded`; a write that began committing completes. Code
    `outcome_unknown` means the commit itself failed in a way that may have left
    the changes applied: read the state back before retrying. Writes of facts
    are idempotent (inserting a present fact or deleting an absent one changes
    nothing), so after `cancelled`, `deadline_exceeded`, `outcome_unknown` or a
    lost connection a client can resend the same write without duplicating it.

    ## Revision preconditions

    An `execute` that writes may carry `expect_revision`: a knowledge graph
    revision the client observed (a subscription's `revision`, or a push's).
    The program's writes then commit only if no relation in scope and no
    persistent rule changed after that revision; the check and the commit
    happen under the knowledge graph's write lock, so they see the same state.
    The scope is `expect_relations` and every relation they are derived from
    through persistent rules, or the whole knowledge graph when
    `expect_relations` is absent. A scope relation that is not a relation,
    rule or schema of the knowledge graph fails with `validation`.

    A refused program applies nothing and fails with `precondition_failed`; the
    message names what changed and at which revision. Retrying the same request
    cannot succeed: read the state again first. Of several writers expecting
    the same revision of the same scope, at most one commits, but only when
    each writer's program writes a relation in that scope. Writes outside the
    scope do not refuse each other, so racing deciders that write a claim
    relation should include it in `expect_relations` or rely on the claim
    guard.

    A restarted engine continues above every revision its earlier runs
    issued. `expect_epoch` names the stream epoch
    (`authenticated.stream_epoch`) the revision belongs to and fails the
    precondition when it is not this run's. Without it, a revision older than
    the knowledge graph's first state in this run (every revision of an
    earlier run is), or not yet issued, still fails. A program that does not write persistent state (queries, session
    rules, meta commands, `.subscribe`) cannot carry `expect_revision`: it is
    rejected with `invalid_request`.

    ## Raw Text Protocol

    The `execute` message accepts any valid IQL statement or meta command as raw text.
    The server parses and executes it, returning structured results.


servers:
  development:
    host: localhost:8080
    protocol: ws
    pathname: /ws
    description: Local development server

channels:
  ws:
    address: /ws
    description: |
      Global WebSocket endpoint with auto-session lifecycle.
      Query parameter `kg` sets the initial knowledge graph (default: "default").
    parameters:
      kg:
        description: Knowledge graph to bind to on connect
        default: default
      last_seq:
        description: |
          Last notification `seq` the client saw, for replay on reconnect. With the
          matching `epoch`, the server replays the retained notifications with a higher
          seq before live ones; otherwise it sends one `replay_gap` notice and replays
          nothing.
      epoch:
        description: |
          The `stream_epoch` from `authenticated` that `last_seq` belongs to. A cursor
          without it, or from another engine run, gets `replay_gap`.
    messages:
      # Client → Server (auth)
      login:
        $ref: '#/components/messages/Login'
      authenticate:
        $ref: '#/components/messages/Authenticate'
      # Client → Server (operations)
      execute:
        $ref: '#/components/messages/Execute'
      ping:
        $ref: '#/components/messages/Ping'
      cancel:
        $ref: '#/components/messages/Cancel'
      # Server → Client (auth)
      authenticated:
        $ref: '#/components/messages/Authenticated'
      auth_error:
        $ref: '#/components/messages/AuthError'
      # Server → Client (results)
      result:
        $ref: '#/components/messages/Result'
      result_start:
        $ref: '#/components/messages/ResultStart'
      result_chunk:
        $ref: '#/components/messages/ResultChunk'
      result_end:
        $ref: '#/components/messages/ResultEnd'
      error:
        $ref: '#/components/messages/Error'
      pong:
        $ref: '#/components/messages/Pong'
      cancel_ack:
        $ref: '#/components/messages/CancelAck'
      notification:
        $ref: '#/components/messages/Notification'
      subscription_delta:
        $ref: '#/components/messages/SubscriptionDelta'
      subscription_delta_start:
        $ref: '#/components/messages/SubscriptionDeltaStart'
      subscription_delta_chunk:
        $ref: '#/components/messages/SubscriptionDeltaChunk'
      subscription_delta_end:
        $ref: '#/components/messages/SubscriptionDeltaEnd'
      subscription_error:
        $ref: '#/components/messages/SubscriptionError'
      subscription_reset:
        $ref: '#/components/messages/SubscriptionReset'
      notice:
        $ref: '#/components/messages/Notice'

operations:
  login:
    action: send
    channel:
      $ref: '#/channels/ws'
    summary: Authenticate with username and password
    description: |
      Must be the first message after WebSocket upgrade. The server responds with
      `authenticated` on success or `auth_error` on failure.
    messages:
      - $ref: '#/channels/ws/messages/login'

  authenticate:
    action: send
    channel:
      $ref: '#/channels/ws'
    summary: Authenticate with an API key
    description: |
      Alternative to `login` for programmatic access. The server responds with
      `authenticated` on success or `auth_error` on failure.
    messages:
      - $ref: '#/channels/ws/messages/authenticate'

  execute:
    action: send
    channel:
      $ref: '#/channels/ws'
    summary: Execute a IQL statement or meta command
    description: |
      Send any valid IQL statement or meta command as raw text.

      **Supported statement types:**
      - `+relation[(v1, v2), ...]` - Insert persistent facts
      - `relation(v1, v2)` - Insert session-scoped (ephemeral) fact
      - `-relation(X, Y) <- condition` - Delete facts matching condition
      - `?relation(X, Y)` - Query a relation
      - `+rule(X, Y) <- body(X, Y)` - Add persistent rule
      - `rule(X, Y) <- body(X, Y)` - Add session-scoped rule

      **Meta commands:**
      - `.kg list` / `.kg create <name>` / `.kg use <name>` / `.kg drop <name>` - KG management
      - `.kg acl list` / `.kg acl grant <kg> <user> <role>` / `.kg acl revoke <kg> <user>` - Access control
      - `.user list` / `.user create` / `.user drop` / `.user password` / `.user role` - User management
      - `.apikey list` / `.apikey create <label> [<ttl>]` / `.apikey expire <label> <ttl>` / `.apikey revoke <label>` - API key management
      - `.rel` / `.rel <name>` / `.rel drop <name>` - List / describe / drop relations
      - `.rule list` / `.rule show <name>` / `.rule drop <name>` - Rule management
      - `.rule drop prefix <prefix>` - Drop rules by prefix
      - `.rule remove <name> <index>` - Remove specific rule clause
      - `.session list` / `.session clear` - Session management
      - `.index list` / `.index create ...` / `.index drop <name>` - Index management
      - `.clear prefix <prefix>` - Clear relations by prefix
      - `.debug <query>` - Show query plan without executing
      - `.subscribe <id> ?<query>` / `.unsubscribe <id>` - Standing queries (replies with the initial snapshot; pushes `subscription_delta`)
      - `.help` - Show available commands
      - `.status` - Server status
      - `.compact` - Trigger compaction
    messages:
      - $ref: '#/channels/ws/messages/execute'

  ping:
    action: send
    channel:
      $ref: '#/channels/ws'
    summary: Keep-alive ping
    messages:
      - $ref: '#/channels/ws/messages/ping'

  cancel:
    action: send
    channel:
      $ref: '#/channels/ws'
    summary: Cancel an unanswered request by its id
    description: |
      Acts on arrival; answered by `cancel_ack`. See "Deadlines and cancellation".
    messages:
      - $ref: '#/channels/ws/messages/cancel'

  onCancelAck:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: What a cancel did to its target
    messages:
      - $ref: '#/channels/ws/messages/cancel_ack'

  onAuthenticated:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Authentication success
    description: |
      Sent after a successful `login` or `authenticate` message.
      Contains the session ID, initial knowledge graph, server version, and user role.
    messages:
      - $ref: '#/channels/ws/messages/authenticated'

  onAuthError:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Authentication failure
    description: Sent when a `login` or `authenticate` message fails. The client may retry.
    messages:
      - $ref: '#/channels/ws/messages/auth_error'

  onResult:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Command/query result
    messages:
      - $ref: '#/channels/ws/messages/result'

  onError:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Error response
    messages:
      - $ref: '#/channels/ws/messages/error'

  onResultStart:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Start of a streamed result
    description: |
      Sent instead of `result` when the serialized result exceeds 1 MiB, including
      the reply to `.subscribe` (then with `subscribed`). Contains metadata and column
      names. Followed by `result_chunk` messages, then a `result_end` message; the
      result is complete only at `result_end`. An `error` with the same `id` instead
      ends the stream as failed: discard the rows received.
    messages:
      - $ref: '#/channels/ws/messages/result_start'

  onResultChunk:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Chunk of streamed result rows
    description: |
      Contains at most 500 rows and about 1 MiB. Chunks are numbered sequentially
      starting from 0 via `chunk_index`.
    messages:
      - $ref: '#/channels/ws/messages/result_chunk'

  onResultEnd:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: End of a streamed result
    description: |
      Signals that all chunks have been sent. Its row and chunk counts are what the
      chunks must add up to; only now is the result complete.
    messages:
      - $ref: '#/channels/ws/messages/result_end'

  onPong:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Pong response to keep-alive
    messages:
      - $ref: '#/channels/ws/messages/pong'

  onNotification:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Push notification for persistent data changes
    description: |
      Sent when persistent data changes in the session's currently bound knowledge graph.
      Notifications are filtered to only include changes for the session's active KG.
    messages:
      - $ref: '#/channels/ws/messages/notification'

  onSubscriptionDelta:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Change to a standing query's result
    description: |
      Pushed after a committed persistent change to a relation the subscribed
      query depends on (directly or through persistent rules) altered its result.
      Set semantics; `seq` starts at 1 per subscription and has no gaps; `revision`
      increases with every delta. Persistent data only. A delta whose frame would
      exceed 1 MiB is streamed instead (`subscription_delta_start`).
    messages:
      - $ref: '#/channels/ws/messages/subscription_delta'

  onSubscriptionDeltaStart:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Start of a delta streamed in chunks
    description: |
      Everything a `subscription_delta` carries but its rows. Followed by
      `subscription_delta_chunk`s and a `subscription_delta_end` for the same
      subscription, generation and `seq`; together they are that one delta. Other
      frames may arrive in between. Apply the delta only at its end.
    messages:
      - $ref: '#/channels/ws/messages/subscription_delta_start'

  onSubscriptionDeltaChunk:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Rows of a streamed delta
    description: |
      At most 500 rows and about 1 MiB, numbered from `chunk_index` 0 without gaps.
      A missing, repeated or out-of-order chunk means the stream is broken: drop the
      subscription's rows and resubscribe.
    messages:
      - $ref: '#/channels/ws/messages/subscription_delta_chunk'

  onSubscriptionDeltaEnd:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: End of a streamed delta
    description: |
      The chunk and row counts the chunks must add up to. Only now does the delta
      apply, advancing the subscription to the start frame's `seq` and `revision`.
    messages:
      - $ref: '#/channels/ws/messages/subscription_delta_end'

  onSubscriptionReset:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: The server ended a subscription it could not keep current
    description: |
      The subscription's next change could not be delivered whole (a row larger than
      any frame, or read access to its knowledge graph was revoked), so the server
      removed the subscription. Discard its rows, including a streamed delta in
      progress, and subscribe again for a fresh snapshot. Nothing more is pushed for
      this generation.
    messages:
      - $ref: '#/channels/ws/messages/subscription_reset'

  onNotice:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Connection event
    description: |
      Sent unprompted, never as a reply and never with an `id`. All codes but
      `notifications_missed` and `replay_gap` are followed by the server closing the connection;
      `credential_revoked` is the last frame of a revoked connection, and
      `credential_expired` of one whose API key expired.
    messages:
      - $ref: '#/channels/ws/messages/notice'

  onSubscriptionError:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Standing query re-evaluation failed
    description: |
      The subscription stays registered and keeps its last complete result;
      the next delta is relative to it. A result cut at `max_result_rows` is
      reported this way instead of being delivered.
    messages:
      - $ref: '#/channels/ws/messages/subscription_error'

components:
  messages:
    Execute:
      name: execute
      title: Execute Command
      summary: Execute any IQL statement or meta command
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ExecuteRequest'

    Ping:
      name: ping
      title: Ping
      summary: Keep-alive ping
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PingRequest'

    Cancel:
      name: cancel
      title: Cancel
      summary: Cancel an unanswered request by its id
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CancelRequest'

    Login:
      name: login
      title: Login
      summary: Authenticate with username and password
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LoginRequest'

    Authenticate:
      name: authenticate
      title: Authenticate
      summary: Authenticate with an API key
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AuthenticateRequest'

    Authenticated:
      name: authenticated
      title: Authenticated
      summary: Authentication succeeded
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AuthenticatedResponse'

    AuthError:
      name: auth_error
      title: Auth Error
      summary: Authentication failed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AuthErrorResponse'

    Result:
      name: result
      title: Result
      summary: Command/query execution result
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ResultResponse'

    Error:
      name: error
      title: Error
      summary: Error response
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ErrorResponse'

    ResultStart:
      name: result_start
      title: Result Start
      summary: Start of a streamed result (for results > 1 MB)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ResultStartResponse'

    ResultChunk:
      name: result_chunk
      title: Result Chunk
      summary: Chunk of streamed result rows
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ResultChunkResponse'

    ResultEnd:
      name: result_end
      title: Result End
      summary: End of streamed result
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ResultEndResponse'

    Pong:
      name: pong
      title: Pong
      summary: Pong response to keep-alive
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PongResponse'

    CancelAck:
      name: cancel_ack
      title: Cancel acknowledgement
      summary: What a cancel did to its target
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CancelAckResponse'

    Notification:
      name: notification
      title: Notification
      summary: Push notification for persistent data changes
      contentType: application/json
      payload:
        $ref: '#/components/schemas/NotificationResponse'

    SubscriptionDelta:
      name: subscription_delta
      title: Subscription Delta
      summary: Rows that entered and left a standing query's result
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptionDeltaResponse'

    Notice:
      name: notice
      title: Notice
      summary: Connection event announced by the server
      contentType: application/json
      payload:
        $ref: '#/components/schemas/NoticeResponse'

    SubscriptionError:
      name: subscription_error
      title: Subscription Error
      summary: Standing query re-evaluation failed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptionErrorResponse'

    SubscriptionDeltaStart:
      name: subscription_delta_start
      title: Subscription Delta Start
      summary: Header of a delta streamed in chunks
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptionDeltaStartResponse'

    SubscriptionDeltaChunk:
      name: subscription_delta_chunk
      title: Subscription Delta Chunk
      summary: Rows of a streamed delta
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptionDeltaChunkResponse'

    SubscriptionDeltaEnd:
      name: subscription_delta_end
      title: Subscription Delta End
      summary: End of a streamed delta, with its counts
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptionDeltaEndResponse'

    SubscriptionReset:
      name: subscription_reset
      title: Subscription Reset
      summary: The server ended a subscription it could not keep current
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptionResetResponse'

  schemas:
    RequestId:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        Client-chosen request identifier, echoed on every reply to the request.
        At most 64 bytes (UTF-8).

    ErrorCode:
      type: string
      enum: [validation, not_found, conflict, unsupported, internal, invalid_request, rate_limited, deadline_exceeded, cancelled, outcome_unknown]
      description: |
        Why a statement or request failed. `invalid_request` (malformed frame or `id`)
        and `rate_limited` reject a whole request before anything runs.
        `deadline_exceeded` and `cancelled` stop it before it began committing, so
        nothing was applied. `outcome_unknown`: the commit failed in a way that may
        have left the changes applied; read the state back before retrying.

    StatementError:
      type: object
      required: [index, code, message]
      properties:
        index:
          type: integer
          description: 0-based statement index in the program
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string

    NoticeResponse:
      type: object
      required: [type, code, message]
      properties:
        type:
          type: string
          const: notice
        code:
          type: string
          enum:
            - notifications_missed
            - replay_gap
            - slow_consumer
            - idle_timeout
            - lifetime_exceeded
            - auth_timeout
            - credential_revoked
            - credential_expired
            - server_shutdown
          description: |
            `notifications_missed`: the client read too slowly and change notifications
            were dropped; standing queries re-evaluate and the connection stays open.
            `replay_gap`: the reconnect cursor could not be honoured and nothing was
            replayed; re-read the state you track. The connection stays open.
            Every other code is followed by the server closing the connection.
        message:
          type: string
      examples:
        - type: notice
          code: idle_timeout
          message: Idle timeout
        - type: notice
          code: credential_revoked
          message: "Credential revoked; reconnect with valid credentials"

    Subscribed:
      type: object
      required: [subscription, generation, revision]
      description: |
        The subscription a `.subscribe` registered. A name can be reused after
        `.unsubscribe`; the generation is unique per connection, so a push whose
        generation differs belongs to an earlier registration and is stale.
        Subscriptions end with their connection.
      properties:
        subscription:
          type: string
        generation:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
          description: |
            Knowledge graph revision the snapshot is the exact answer at; every later
            delta names a higher one. Comparable only within one knowledge graph and
            stream epoch.

    SubscriptionDeltaResponse:
      type: object
      required: [type, subscription, generation, knowledge_graph, seq, revision, columns, inserted, retracted]
      properties:
        type:
          type: string
          const: subscription_delta
        subscription:
          type: string
          description: Client-chosen name from `.subscribe`
        generation:
          type: integer
          format: int64
          description: The registration this delta belongs to (see `Subscribed`)
        knowledge_graph:
          type: string
        seq:
          type: integer
          format: int64
          description: |
            Per-subscription delta number, starting at 1, without gaps. Any other number
            means a delta was lost: resubscribe.
        revision:
          type: integer
          format: int64
          description: |
            Knowledge graph revision this delta brings the result to: the previous result
            plus this delta is the query's exact answer at `revision`.
        columns:
          type: array
          items:
            type: string
        inserted:
          type: array
          description: Rows now in the result, sorted
          items:
            type: array
        retracted:
          type: array
          description: Rows no longer in the result, sorted
          items:
            type: array
      examples:
        - type: subscription_delta
          subscription: late_orders
          generation: 1
          knowledge_graph: default
          seq: 1
          revision: 17
          columns: [Order, Customer]
          inserted: [[1042, acme]]
          retracted: []

    SubscriptionErrorResponse:
      type: object
      required: [type, subscription, generation, message]
      properties:
        type:
          type: string
          const: subscription_error
        subscription:
          type: string
        generation:
          type: integer
          format: int64
        message:
          type: string
      examples:
        - type: subscription_error
          subscription: late_orders
          generation: 1
          message: Access denied

    SubscriptionDeltaStartResponse:
      type: object
      required: [type, subscription, generation, knowledge_graph, seq, revision, columns]
      properties:
        type:
          type: string
          const: subscription_delta_start
        subscription:
          type: string
        generation:
          type: integer
          format: int64
        knowledge_graph:
          type: string
        seq:
          type: integer
          format: int64
          description: The delta's number, as for `subscription_delta`
        revision:
          type: integer
          format: int64
          description: The revision the result reaches once the delta applies
        columns:
          type: array
          items:
            type: string
      examples:
        - type: subscription_delta_start
          subscription: late_orders
          generation: 1
          knowledge_graph: default
          seq: 2
          revision: 18
          columns: [Order, Customer]

    SubscriptionDeltaChunkResponse:
      type: object
      required: [type, subscription, generation, seq, chunk_index, inserted, retracted]
      properties:
        type:
          type: string
          const: subscription_delta_chunk
        subscription:
          type: string
        generation:
          type: integer
          format: int64
        seq:
          type: integer
          format: int64
          description: The streamed delta this chunk belongs to
        chunk_index:
          type: integer
          description: 0-based, without gaps
        inserted:
          type: array
          description: Rows entering the result
          items:
            type: array
        retracted:
          type: array
          description: Rows leaving the result
          items:
            type: array
      examples:
        - type: subscription_delta_chunk
          subscription: late_orders
          generation: 1
          seq: 2
          chunk_index: 0
          inserted: [[1043, initech]]
          retracted: []

    SubscriptionDeltaEndResponse:
      type: object
      required: [type, subscription, generation, seq, chunk_count, inserted_count, retracted_count]
      properties:
        type:
          type: string
          const: subscription_delta_end
        subscription:
          type: string
        generation:
          type: integer
          format: int64
        seq:
          type: integer
          format: int64
        chunk_count:
          type: integer
          description: Number of chunks sent
        inserted_count:
          type: integer
          description: Inserted rows across all chunks
        retracted_count:
          type: integer
          description: Retracted rows across all chunks
      examples:
        - type: subscription_delta_end
          subscription: late_orders
          generation: 1
          seq: 2
          chunk_count: 40
          inserted_count: 20000
          retracted_count: 0

    SubscriptionResetResponse:
      type: object
      required: [type, subscription, generation, message]
      properties:
        type:
          type: string
          const: subscription_reset
        subscription:
          type: string
        generation:
          type: integer
          format: int64
        message:
          type: string
          description: Why the change could not be delivered
      examples:
        - type: subscription_reset
          subscription: late_orders
          generation: 1
          message: >-
            Delta 2 has a row of 17000000 bytes, over the 16777216-byte message limit.
            The subscription was removed; subscribe again.

    ExecuteRequest:
      type: object
      required:
        - type
        - program
      properties:
        type:
          type: string
          const: execute
          description: Message type discriminator
        id:
          $ref: '#/components/schemas/RequestId'
        program:
          type: string
          description: |
            Any valid IQL statement or meta command as raw text.
            Examples: "+edge[(1,2)]", "?edge(X,Y)", ".kg list", ".rule list"
        timeout_ms:
          type: integer
          minimum: 0
          description: |
            Milliseconds the request may take from arrival (queueing, admission and
            computation together). Capped by `storage.performance.query_timeout_ms`.
      examples:
        - type: execute
          id: "1"
          program: "+edge[(1, 2), (3, 4)]"
        - type: execute
          program: "?edge(X, Y)"
        - type: execute
          program: ".kg list"
        - type: execute
          program: "+path(X, Y) <- edge(X, Y)"

    PingRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: ping
        id:
          $ref: '#/components/schemas/RequestId'
      examples:
        - type: ping

    CancelRequest:
      type: object
      required:
        - type
        - target
      properties:
        type:
          type: string
          const: cancel
        id:
          $ref: '#/components/schemas/RequestId'
        target:
          $ref: '#/components/schemas/RequestId'
      examples:
        - type: cancel
          id: "c1"
          target: "42"

    LoginRequest:
      type: object
      required:
        - type
        - username
        - password
      properties:
        type:
          type: string
          const: login
        id:
          $ref: '#/components/schemas/RequestId'
        username:
          type: string
          description: User's username
        password:
          type: string
          description: User's password
      examples:
        - type: login
          username: admin
          password: secret

    AuthenticateRequest:
      type: object
      required:
        - type
        - api_key
      properties:
        type:
          type: string
          const: authenticate
        id:
          $ref: '#/components/schemas/RequestId'
        api_key:
          type: string
          description: API key for programmatic access
      examples:
        - type: authenticate
          api_key: "il_key_abc123..."

    AuthenticatedResponse:
      type: object
      required:
        - type
        - session_id
        - knowledge_graph
        - version
        - role
        - protocol_version
        - stream_epoch
      properties:
        type:
          type: string
          const: authenticated
        id:
          $ref: '#/components/schemas/RequestId'
        session_id:
          type: string
          description: Auto-created session ID
        knowledge_graph:
          type: string
          description: Initial knowledge graph the session is bound to
        version:
          type: string
          description: Server version string
        role:
          type: string
          description: Authenticated user's role (admin, writer, reader)
        protocol_version:
          type: integer
          description: Version of this protocol the server speaks (2)
        stream_epoch:
          type: string
          description: |
            Id of this engine run. Notification `seq` numbers and knowledge graph
            revisions belong to it; pass it back as `epoch` with `last_seq` on reconnect.
      examples:
        - type: authenticated
          id: "1"
          protocol_version: 2
          stream_epoch: 3f9c2a7e01b4d865
          session_id: "42"
          knowledge_graph: default
          version: "0.1.0"
          role: admin

    AuthErrorResponse:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
          const: auth_error
        id:
          $ref: '#/components/schemas/RequestId'
        message:
          type: string
          description: Human-readable authentication error
      examples:
        - type: auth_error
          message: "Invalid username or password"

    ResultResponse:
      type: object
      required:
        - type
        - columns
        - rows
        - row_count
        - total_count
        - truncated
        - execution_time_ms
        - errors
      properties:
        type:
          type: string
          const: result
        id:
          $ref: '#/components/schemas/RequestId'
        columns:
          type: array
          items:
            type: string
          description: Column names from the result schema
        rows:
          type: array
          items:
            type: array
            items: {}
          description: Result rows, each row is an array of values
        row_count:
          type: integer
          description: Number of rows returned
        total_count:
          type: integer
          description: Total number of rows (before truncation)
        truncated:
          type: boolean
          description: Whether the result was truncated
        execution_time_ms:
          type: integer
          format: int64
          description: Execution time in milliseconds
        row_provenance:
          type: array
          items:
            type: string
          description: |
            Per-row provenance. Values include "persistent", "ephemeral", "mixed",
            or "unknown" when provenance cannot be determined.
        metadata:
          $ref: '#/components/schemas/SessionQueryMetadata'
        switched_kg:
          type: string
          description: |
            Present when the command switched the session's knowledge graph
            (e.g., after `.kg use <name>` or `.kg create <name>`).
            The client should update its local KG tracking.
        proof_trees:
          type: array
          items: {}
          description: Derivations of a `.why` result
        timing_breakdown:
          type: object
          description: Per-stage execution timing in microseconds
        errors:
          type: array
          items:
            $ref: '#/components/schemas/StatementError'
          description: Failed statements of the program; empty when every statement succeeded
        subscribed:
          $ref: '#/components/schemas/Subscribed'
          description: Set on the reply to `.subscribe`, whose `rows` are the snapshot
      examples:
        - type: result
          id: "2"
          columns: ["col0", "col1"]
          rows: [[1, 2], [3, 4]]
          row_count: 2
          total_count: 2
          truncated: false
          execution_time_ms: 5
        - type: result
          columns: ["message"]
          rows: [["Switched to knowledge graph: test"]]
          row_count: 1
          total_count: 1
          truncated: false
          execution_time_ms: 1
          switched_kg: test

    ErrorResponse:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
          const: error
        id:
          $ref: '#/components/schemas/RequestId'
        message:
          type: string
          description: |
            Human-readable error message. An `error` always answers a request;
            connection events are `notice` frames.
        validation_errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
          description: Detailed validation errors (present for parse/validation errors)
        code:
          $ref: '#/components/schemas/ErrorCode'
      examples:
        - type: error
          id: "3"
          message: "Program has 1 parse error(s)"
          code: validation
        - type: error
          id: "4"
          message: "Knowledge graph 'missing' not found"
          code: not_found
        - type: error
          message: "Invalid message format: request id is empty"
          code: invalid_request

    ResultStartResponse:
      type: object
      required:
        - type
        - columns
        - total_count
        - truncated
        - execution_time_ms
      properties:
        type:
          type: string
          const: result_start
        id:
          $ref: '#/components/schemas/RequestId'
        columns:
          type: array
          items:
            type: string
          description: Column names from the result schema
        total_count:
          type: integer
          description: Total number of rows across all chunks
        truncated:
          type: boolean
          description: Whether the result was truncated
        execution_time_ms:
          type: integer
          format: int64
          description: Execution time in milliseconds
        metadata:
          $ref: '#/components/schemas/SessionQueryMetadata'
        switched_kg:
          type: string
          description: Present when the command switched the session's knowledge graph
        proof_trees:
          type: array
          items: {}
        timing_breakdown:
          type: object
        errors:
          type: array
          items:
            $ref: '#/components/schemas/StatementError'
        subscribed:
          $ref: '#/components/schemas/Subscribed'
      examples:
        - type: result_start
          columns: ["id", "name", "score"]
          total_count: 50000
          truncated: false
          execution_time_ms: 120

    ResultChunkResponse:
      type: object
      required:
        - type
        - rows
        - chunk_index
      properties:
        type:
          type: string
          const: result_chunk
        id:
          $ref: '#/components/schemas/RequestId'
        rows:
          type: array
          items:
            type: array
            items: {}
          description: Result rows in this chunk (at most 500 rows and about 1 MiB)
        row_provenance:
          type: array
          items:
            type: string
          description: Per-row provenance for this chunk
        chunk_index:
          type: integer
          description: 0-based chunk sequence number
      examples:
        - type: result_chunk
          rows: [[1, "alice", 95], [2, "bob", 87]]
          chunk_index: 0

    ResultEndResponse:
      type: object
      required:
        - type
        - row_count
        - chunk_count
      properties:
        type:
          type: string
          const: result_end
        id:
          $ref: '#/components/schemas/RequestId'
        row_count:
          type: integer
          description: Total number of rows sent across all chunks
        chunk_count:
          type: integer
          description: Number of chunks that were sent
      examples:
        - type: result_end
          row_count: 50000
          chunk_count: 100

    PongResponse:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: pong
        id:
          $ref: '#/components/schemas/RequestId'
      examples:
        - type: pong

    CancelAckResponse:
      type: object
      required:
        - type
        - target
        - outcome
      properties:
        type:
          type: string
          const: cancel_ack
        id:
          $ref: '#/components/schemas/RequestId'
        target:
          $ref: '#/components/schemas/RequestId'
        outcome:
          type: string
          enum: [cancelled, too_late, not_found]
      examples:
        - type: cancel_ack
          id: "c1"
          target: "42"
          outcome: cancelled

    NotificationResponse:
      type: object
      required:
        - type
        - seq
        - timestamp_ms
      discriminator: type
      description: |
        Push notification for data/schema/rule/KG changes. The `type` field
        discriminates the event kind. All notifications carry a `seq` number,
        strictly increasing in delivery order within the stream epoch, for replay on
        reconnect (see the `last_seq` and `epoch` query params).
        A session receives changes to its own knowledge graph; `kg_change` for
        other knowledge graphs is sent to admin sessions only. Changes to
        `_internal` are never sent, nor changes to a knowledge graph the user's
        access to was revoked (`.kg acl revoke`). Replay applies the same rules.
      properties:
        type:
          type: string
          enum: [persistent_update, rule_change, kg_change, schema_change]
          description: Event type discriminator
        seq:
          type: integer
          format: int64
          description: |
            Position in the stream epoch's notification stream (1-based, strictly
            increasing in delivery order). Unrelated to a subscription's `seq`.
        timestamp_ms:
          type: integer
          format: int64
          description: Server timestamp in milliseconds since Unix epoch
        session_id:
          type: string
          description: Session that triggered the change (if applicable)
        knowledge_graph:
          type: string
          description: Knowledge graph where the change occurred

        # persistent_update fields
        relation:
          type: string
          description: "Relation that was modified (persistent_update only)"
        operation:
          type: string
          description: |
            Type of operation. Values depend on event type:
            - persistent_update: "insert", "delete"
            - rule_change: "registered", "removed", "dropped"
            - kg_change: "created", "dropped"
            - schema_change: "created", "dropped"
        count:
          type: integer
          description: "Number of tuples affected (persistent_update only)"

        # rule_change fields
        rule_name:
          type: string
          description: "Name of the rule (rule_change only)"

        # schema_change fields
        entity:
          type: string
          description: "Name of the schema entity (schema_change only)"
      examples:
        - type: persistent_update
          knowledge_graph: default
          relation: edge
          operation: insert
          count: 5
          seq: 42
          timestamp_ms: 1708732800000
        - type: rule_change
          knowledge_graph: default
          rule_name: reachable
          operation: registered
          seq: 43
          timestamp_ms: 1708732801000
        - type: kg_change
          knowledge_graph: analytics
          operation: created
          seq: 44
          timestamp_ms: 1708732802000
        - type: schema_change
          knowledge_graph: default
          entity: users
          operation: created
          seq: 45
          timestamp_ms: 1708732803000

    ValidationError:
      type: object
      required:
        - line
        - statement_index
        - error
      properties:
        line:
          type: integer
          description: 1-based line number in the original program text
        statement_index:
          type: integer
          description: 0-based index of the statement (counting only non-empty lines)
        error:
          type: string
          description: The parse error message

    SessionQueryMetadata:
      type: object
      properties:
        has_ephemeral:
          type: boolean
          description: Whether the result includes ephemeral (session-scoped) data
        ephemeral_sources:
          type: array
          items:
            type: string
          description: Relations that contributed ephemeral data to the result
        warnings:
          type: array
          items:
            type: string
          description: Any warnings generated during query execution

  # HTTP Endpoints (not WebSocket, documented here for completeness)
  # These are served alongside the WebSocket endpoint on the same port.
  x-http-endpoints:
    health:
      method: GET
      path: /health
      description: Health check endpoint. Returns 200 with JSON body.
      response:
        type: object
        properties:
          status:
            type: string
            const: healthy
    metrics:
      method: GET
      path: /metrics
      description: Server statistics endpoint. Returns query counts, uptime, and KG info.

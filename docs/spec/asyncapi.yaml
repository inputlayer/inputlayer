    Notice:
      name: notice
      title: Notice
      summary: Connection event announced by the server
      contentType: application/json
      payload:
        $ref: '#/components/schemas/NoticeResponse'

    SubscriptionError:
      name: subscription_error
      title: Subscription Error
      summary: Standing query re-evaluation failed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptionErrorResponse'

    SubscriptionDeltaStart:
      name: subscription_delta_start
      title: Subscription Delta Start
      summary: Header of a delta streamed in chunks
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptionDeltaStartResponse'

    SubscriptionDeltaChunk:
      name: subscription_delta_chunk
      title: Subscription Delta Chunk
      summary: Rows of a streamed delta
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptionDeltaChunkResponse'

    SubscriptionDeltaEnd:
      name: subscription_delta_end
      title: Subscription Delta End
      summary: End of a streamed delta, with its counts
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptionDeltaEndResponse'

    SubscriptionReset:
      name: subscription_reset
      title: Subscription Reset
      summary: The server ended a subscription it could not keep current
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptionResetResponse'

  schemas:
    RequestId:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        Client-chosen request identifier, echoed on every reply to the request.
        At most 64 bytes (UTF-8).

    ErrorCode:
      type: string
      enum: [validation, not_found, conflict, unsupported, internal, invalid_request, rate_limited, deadline_exceeded, cancelled, outcome_unknown, store_read_only, resource_exhausted, precondition_failed, replica_unconfirmed, access_denied, overloaded]
      description: |
        Why a statement or request failed. `invalid_request` (malformed frame or `id`)
        and `rate_limited` reject a whole request before anything runs.
        `deadline_exceeded` and `cancelled` stop it before it began committing, so
        nothing was applied. `outcome_unknown`: the commit failed in a way that may
        have left the changes applied; read the state back before retrying.
        `store_read_only`: the write was refused because the store is read-only
        until restart recovery. `resource_exhausted`: a query went over the
        per-query memory limit or grew while the server's queries held their
        whole memory budget, or a write would grow its knowledge graph past
        its memory budget; nothing was applied. `precondition_failed`: the
        program's `expect_revision` did not hold; nothing was applied.
        `replica_unconfirmed`: the write committed on a primary shipping
        synchronously, but no replica confirmed it within
        `replication.sync_timeout_ms`; it is applied there, so do not retry it
        as a failed write.
        `access_denied`: the caller may not do this (its role, its write grants
        or its API key's scope do not allow the statement, or its credential was
        revoked or has expired); nothing ran.
        `overloaded`: the server could not admit the request to compute in time:
        its lane's queue was full, or no compute permit came within the longest
        admission wait (`storage.performance.admission.max_wait_ms`) while the
        request's own deadline was later. Nothing ran and nothing was applied;
        retry later, with backoff.

    StatementError:
      type: object
      required: [index, code, message]
      properties:
        index:
          type: integer
          description: 0-based statement index in the program
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string

    StatementCounts:
      type: object
      required: [index, kind, inserted, deleted]
      description: |
        What a committed fact statement changed. Counts are effective, as of
        the statements before it in the same program: `inserted` counts tuples
        that were absent and are now present, `deleted` tuples that were
        present and are now absent. A statement that changed nothing is listed
        with zero counts.
      properties:
        index:
          type: integer
          description: 0-based statement index in the program
        kind:
          type: string
          enum: [insert, delete, update]
        inserted:
          type: integer
        deleted:
          type: integer

    NoticeResponse:
      type: object
      required: [type, code, message]
      properties:
        type:
          type: string
          const: notice
        code:
          type: string
          enum:
            - notifications_missed
            - replay_gap
            - slow_consumer
            - idle_timeout
            - lifetime_exceeded
            - auth_timeout
            - credential_revoked
            - credential_expired
            - server_shutdown
          description: |
            `notifications_missed`: the client read too slowly and change notifications
            were dropped; the connection stays open and subscription deltas are unaffected.
            `replay_gap`: the reconnect cursor could not be honoured and nothing was
            replayed; re-read the state you track. The connection stays open.
            Every other code is followed by the server closing the connection.
        message:
          type: string
      examples:
        - type: notice
          code: idle_timeout
          message: Idle timeout
        - type: notice
          code: credential_revoked
          message: "Credential revoked; reconnect with valid credentials"

    Subscribed:
      type: object
      required: [subscription, generation, revision]
      description: |
        The subscription a `.subscribe` or `subscribe` registered. A name can be reused after
        `.unsubscribe`; the generation is unique per connection, so a push whose
        generation differs belongs to an earlier registration and is stale.
        Subscriptions end with their connection.
      properties:
        subscription:
          type: string
        generation:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
          description: |
            Knowledge graph revision the snapshot is the exact answer at; every later
            delta names a higher one. Comparable only within one knowledge graph and
            stream epoch.

    SubscriptionDeltaResponse:
      type: object
      required: [type, subscription, generation, knowledge_graph, seq, revision, columns, inserted, retracted]
      properties:
        type:
          type: string
          const: subscription_delta
        subscription:
          type: string
          description: Client-chosen name from `.subscribe`
        generation:
          type: integer
          format: int64
          description: The registration this delta belongs to (see `Subscribed`)
        knowledge_graph:
          type: string
        seq:
          type: integer
          format: int64
          description: |
            Per-subscription delta number, starting at 1, without gaps. Any other number
            means a delta was lost: resubscribe.
        revision:
          type: integer
          format: int64
          description: |
            Knowledge graph revision this delta brings the result to: the previous result
            plus this delta is the query's exact answer at `revision`.
        columns:
          type: array
          items:
            type: string
        inserted:
          type: array
          description: Rows now in the result, sorted
          items:
            type: array
        retracted:
          type: array
          description: Rows no longer in the result, sorted
          items:
            type: array
      examples:
        - type: subscription_delta
          subscription: late_orders
          generation: 1
          knowledge_graph: default
          seq: 1
          revision: 17
          columns: [Order, Customer]
          inserted: [[1042, acme]]
          retracted: []

    SubscriptionErrorResponse:
      type: object
      required: [type, subscription, generation, message]
      properties:
        type:
          type: string
          const: subscription_error
        subscription:
          type: string
        generation:
          type: integer
          format: int64
        message:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: |
            `access_denied` when the subscriber may no longer read the knowledge
            graph. Absent for a failed re-evaluation.
      examples:
        - type: subscription_error
          subscription: late_orders
          generation: 1
          message: Access denied
          code: access_denied

    SubscriptionDeltaStartResponse:
      type: object
      required: [type, subscription, generation, knowledge_graph, seq, revision, columns]
      properties:
        type:
          type: string
          const: subscription_delta_start
        subscription:
          type: string
        generation:
          type: integer
          format: int64
        knowledge_graph:
          type: string
        seq:
          type: integer
          format: int64
          description: The delta's number, as for `subscription_delta`
        revision:
          type: integer
          format: int64
          description: The revision the result reaches once the delta applies
        columns:
          type: array
          items:
            type: string
      examples:
        - type: subscription_delta_start
          subscription: late_orders
          generation: 1
          knowledge_graph: default
          seq: 2
          revision: 18
          columns: [Order, Customer]

    SubscriptionDeltaChunkResponse:
      type: object
      required: [type, subscription, generation, seq, chunk_index, inserted, retracted]
      properties:
        type:
          type: string
          const: subscription_delta_chunk
        subscription:
          type: string
        generation:
          type: integer
          format: int64
        seq:
          type: integer
          format: int64
          description: The streamed delta this chunk belongs to
        chunk_index:
          type: integer
          description: 0-based, without gaps
        inserted:
          type: array
          description: Rows entering the result
          items:
            type: array
        retracted:
          type: array
          description: Rows leaving the result
          items:
            type: array
      examples:
        - type: subscription_delta_chunk
          subscription: late_orders
          generation: 1
          seq: 2
          chunk_index: 0
          inserted: [[1043, initech]]
          retracted: []

    SubscriptionDeltaEndResponse:
      type: object
      required: [type, subscription, generation, seq, chunk_count, inserted_count, retracted_count]
      properties:
        type:
          type: string
          const: subscription_delta_end
        subscription:
          type: string
        generation:
          type: integer
          format: int64
        seq:
          type: integer
          format: int64
        chunk_count:
          type: integer
          description: Number of chunks sent
        inserted_count:
          type: integer
          description: Inserted rows across all chunks
        retracted_count:
          type: integer
          description: Retracted rows across all chunks
      examples:
        - type: subscription_delta_end
          subscription: late_orders
          generation: 1
          seq: 2
          chunk_count: 40
          inserted_count: 20000
          retracted_count: 0

    SubscriptionResetResponse:
      type: object
      required: [type, subscription, generation, message]
      properties:
        type:
          type: string
          const: subscription_reset
        subscription:
          type: string
        generation:
          type: integer
          format: int64
        message:
          type: string
          description: Why the change could not be delivered
      examples:
        - type: subscription_reset
          subscription: late_orders
          generation: 1
          message: >-
            Delta 2 has a row of 17000000 bytes, over the 16777216-byte message limit.
            The subscription was removed; subscribe again.

    ExecuteRequest:
      type: object
      required:
        - type
        - program
      properties:
        type:
          type: string
          const: execute
          description: Message type discriminator
        id:
          $ref: '#/components/schemas/RequestId'
        program:
          type: string
          description: |
            Any valid IQL statement or meta command as raw text.
            Examples: "+edge[(1,2)]", "?edge(X,Y)", ".kg list", ".rule list"
        params:
          $ref: '#/components/schemas/Params'
        timeout_ms:
          type: integer
          minimum: 0
          description: |
            Milliseconds the request may take from arrival (queueing, admission and
            computation together). Capped by `storage.performance.query_timeout_ms`.
        expect_revision:
          type: integer
          minimum: 0
          description: |
            Commit the program's writes only if no relation in scope and no
            persistent rule changed after this revision; otherwise nothing is
            applied and the program fails with `precondition_failed`. Only a
            program that writes persistent state may set it. See "Revision
            preconditions".
        expect_relations:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: |
            The scope of `expect_revision`: these relations and every relation
            they are derived from through persistent rules. Absent: the whole
            knowledge graph. Requires `expect_revision`.
        expect_epoch:
          type: string
          description: |
            The stream epoch (`authenticated.stream_epoch`) `expect_revision`
            belongs to; another run's epoch fails the precondition. Requires
            `expect_revision`.
      examples:
        - type: execute
          id: "1"
          program: "+edge[(1, 2), (3, 4)]"
        - type: execute
          program: "?edge(X, Y)"
        - type: execute
          program: ".kg list"
        - type: execute
          program: "+path(X, Y) <- edge(X, Y)"
        - type: execute
          id: "decide-1"
          program: "+claim(\"s1\", \"call_carrier\")"
          expect_revision: 1731
          expect_relations: ["eta"]
        - type: execute
          id: "2"
          program: "+eta($shipment, $date)"
          params:
            shipment: "S-77"
            date: "2026-10-10"

    Params:
      type: object
      description: |
        Values of the program's `$name` parameters, sent beside its text. The engine
        binds each value to the program's parsed statements: a value is never lexed or
        parsed, so no value can change what a program does, whatever characters it holds.
        A parameter stands where a literal may stand (an atom argument, a comparison or
        arithmetic operand, a function argument, an `hnsw_nearest` query vector) and
        binds exactly the value its literal would. Meta commands take none.

        Every parameter the program references must be given, and every one given must be
        referenced; otherwise the request fails with code `validation` and nothing runs.
        Values that cannot be bound exactly fail the frame with `invalid_request`: `null`
        (what JSON.stringify writes for NaN and the infinities), integers outside int64,
        a bare integral number of magnitude 2^63 or more, a bare negative zero (`-0` and
        `-0.0` read alike: send `0` for an int or `{"float": -0.0}` for a float),
        `{"float": n}` for an integer within int64 or uint64 range that no float equals,
        `{"int": ...}` with a fraction, unknown type tags, a name given twice, or a name
        that is not an identifier. `{"float": n}` for a larger integer binds the float
        nearest `n`, as the same float literal in IQL would. Parameter values count toward
        `storage.performance.max_query_size_bytes`. The request log records the program
        text and the number of parameters, not their values.
      propertyNames:
        pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$'
      additionalProperties:
        $ref: '#/components/schemas/ParamValue'

    ParamValue:
      description: |
        A bare JSON value is typed by its form: a string, a boolean, an integer (int64;
        no fraction or exponent), a float (with a fraction or exponent) or an array of
        numbers (a vector). The one-key form names the type explicitly: `{"float": 1}` is
        a float, and `{"int": "9007199254740993"}` an int beyond JavaScript's safe range.
      oneOf:
        - type: string
        - type: boolean
        - type: integer
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        - type: number
        - type: array
          items:
            type: number
        - type: object
          minProperties: 1
          maxProperties: 1
          properties:
            int:
              oneOf:
                - type: integer
                - type: string
                  pattern: '^-?[0-9]+$'
            float:
              type: number
            string:
              type: string
            bool:
              type: boolean
            vector:
              type: array
              items:
                type: number
          additionalProperties: false

    NamedQuery:
      type: object
      required: [name, query]
      description: One query of a `read` or `subscribe`, and the name its result goes by.
      properties:
        name:
          type: string
          minLength: 1
          description: Unique within the request
        query:
          type: string
          description: |
            One `?` query. A `read` query may carry limit/offset and sort annotations;
            a `subscribe` query may not (a subscription tracks the whole result).

    ReadRequest:
      type: object
      required: [type, queries]
      properties:
        type:
          type: string
          const: read
        id:
          $ref: '#/components/schemas/RequestId'
        queries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NamedQuery'
        timeout_ms:
          type: integer
          minimum: 0
          description: As for `execute`; stops every query of the read.
      examples:
        - type: read
          id: "w1"
          queries:
            - {name: orders, query: "?order(S, O)"}
            - {name: eta, query: "?eta(O, T)"}

    SubscribeRequest:
      type: object
      required: [type, subscription, queries]
      properties:
        type:
          type: string
          const: subscribe
        id:
          $ref: '#/components/schemas/RequestId'
        subscription:
          type: string
          pattern: '^[A-Za-z0-9_.:-]{1,128}$'
          description: The group's name, under the `.subscribe` id rules and shared with `.subscribe` names on this connection
        queries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NamedQuery'
      examples:
        - type: subscribe
          id: "s1"
          subscription: window
          queries:
            - {name: orders, query: "?order(S, O)"}
            - {name: eta, query: "?eta(O, T)"}

    NamedResult:
      type: object
      required: [name, columns, rows, total_count, truncated]
      properties:
        name:
          type: string
          description: The query's name in the request
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
        total_count:
          type: integer
          description: Rows before the result cap
        truncated:
          type: boolean
          description: Whether the result cap cut the rows; never set in a group's snapshot

    SnapshotResponse:
      type: object
      required: [type, knowledge_graph, revision, results, execution_time_ms]
      properties:
        type:
          type: string
          const: snapshot
        id:
          $ref: '#/components/schemas/RequestId'
        knowledge_graph:
          type: string
        revision:
          type: integer
          format: int64
          description: The knowledge graph revision every result is the exact answer at
        results:
          type: array
          description: One per query of the request, in its order
          items:
            $ref: '#/components/schemas/NamedResult'
        execution_time_ms:
          type: integer
        subscribed:
          $ref: '#/components/schemas/Subscribed'
      examples:
        - type: snapshot
          id: "s1"
          knowledge_graph: default
          revision: 17
          results:
            - {name: orders, columns: [S, O], rows: [[1, 1042]], total_count: 1, truncated: false}
            - {name: eta, columns: [O, T], rows: [], total_count: 0, truncated: false}
          execution_time_ms: 2
          subscribed: {subscription: window, generation: 1, revision: 17}

    SnapshotStartResponse:
      type: object
      required: [type, knowledge_graph, revision, results, execution_time_ms]
      properties:
        type:
          type: string
          const: snapshot_start
        id:
          $ref: '#/components/schemas/RequestId'
        knowledge_graph:
          type: string
        revision:
          type: integer
          format: int64
        results:
          type: array
          items:
            type: object
            required: [name, columns, row_count, total_count, truncated]
            properties:
              name:
                type: string
              columns:
                type: array
                items:
                  type: string
              row_count:
                type: integer
                description: Rows this result's chunks carry, in total
              total_count:
                type: integer
              truncated:
                type: boolean
        execution_time_ms:
          type: integer
        subscribed:
          $ref: '#/components/schemas/Subscribed'

    SnapshotChunkResponse:
      type: object
      required: [type, result, chunk_index, rows]
      properties:
        type:
          type: string
          const: snapshot_chunk
        id:
          $ref: '#/components/schemas/RequestId'
        result:
          type: integer
          description: Index of the result these rows belong to
        chunk_index:
          type: integer
          description: 0-based across all results, without gaps
        rows:
          type: array
          items:
            type: array

    SnapshotEndResponse:
      type: object
      required: [type, chunk_count]
      properties:
        type:
          type: string
          const: snapshot_end
        id:
          $ref: '#/components/schemas/RequestId'
        chunk_count:
          type: integer
          description: Number of chunks sent

    GroupMemberDelta:
      type: object
      required: [name, unchanged, columns, inserted, retracted]
      properties:
        name:
          type: string
          description: The member's name in the `subscribe` request
        unchanged:
          type: boolean
          description: The member's result did not change; `inserted` and `retracted` are empty
        columns:
          type: array
          items:
            type: string
        inserted:
          type: array
          description: Rows now in the member's result, sorted
          items:
            type: array
        retracted:
          type: array
          description: Rows no longer in the member's result, sorted
          items:
            type: array

    SubscriptionGroupDeltaResponse:
      type: object
      required: [type, subscription, generation, knowledge_graph, seq, revision, members]
      properties:
        type:
          type: string
          const: subscription_group_delta
        subscription:
          type: string
        generation:
          type: integer
          format: int64
        knowledge_graph:
          type: string
        seq:
          type: integer
          format: int64
          description: Per-group push number, starting at 1, without gaps
        revision:
          type: integer
          format: int64
          description: The revision every member is the exact answer at once this applies
        members:
          type: array
          description: Every member, in the group's order
          items:
            $ref: '#/components/schemas/GroupMemberDelta'
      examples:
        - type: subscription_group_delta
          subscription: window
          generation: 1
          knowledge_graph: default
          seq: 1
          revision: 18
          members:
            - {name: orders, unchanged: true, columns: [S, O], inserted: [], retracted: []}
            - {name: eta, unchanged: false, columns: [O, T], inserted: [[1042, "2026-10-05"]], retracted: []}

    SubscriptionGroupDeltaStartResponse:
      type: object
      required: [type, subscription, generation, knowledge_graph, seq, revision, members]
      properties:
        type:
          type: string
          const: subscription_group_delta_start
        subscription:
          type: string
        generation:
          type: integer
          format: int64
        knowledge_graph:
          type: string
        seq:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        members:
          type: array
          items:
            type: object
            required: [name, unchanged, columns, inserted_count, retracted_count]
            properties:
              name:
                type: string
              unchanged:
                type: boolean
              columns:
                type: array
                items:
                  type: string
              inserted_count:
                type: integer
              retracted_count:
                type: integer

    SubscriptionGroupDeltaChunkResponse:
      type: object
      required: [type, subscription, generation, seq, chunk_index, member, inserted, retracted]
      properties:
        type:
          type: string
          const: subscription_group_delta_chunk
        subscription:
          type: string
        generation:
          type: integer
          format: int64
        seq:
          type: integer
          format: int64
        chunk_index:
          type: integer
          description: 0-based across all members, without gaps
        member:
          type: integer
          description: Index of the member these rows belong to
        inserted:
          type: array
          items:
            type: array
        retracted:
          type: array
          items:
            type: array

    SubscriptionGroupDeltaEndResponse:
      type: object
      required: [type, subscription, generation, seq, chunk_count]
      properties:
        type:
          type: string
          const: subscription_group_delta_end
        subscription:
          type: string
        generation:
          type: integer
          format: int64
        seq:
          type: integer
          format: int64
        chunk_count:
          type: integer

    PingRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: ping
        id:
          $ref: '#/components/schemas/RequestId'
      examples:
        - type: ping

    CancelRequest:
      type: object
      required:
        - type
        - target
      properties:
        type:
          type: string
          const: cancel
        id:
          $ref: '#/components/schemas/RequestId'
        target:
          $ref: '#/components/schemas/RequestId'
      examples:
        - type: cancel
          id: "c1"
          target: "42"

    LoginRequest:
      type: object
      required:
        - type
        - username
        - password
      properties:
        type:
          type: string
          const: login
        id:
          $ref: '#/components/schemas/RequestId'
        username:
          type: string
          description: User's username
        password:
          type: string
          description: User's password
      examples:
        - type: login
          username: admin
          password: secret

    AuthenticateRequest:
      type: object
      required:
        - type
        - api_key
      properties:
        type:
          type: string
          const: authenticate
        id:
          $ref: '#/components/schemas/RequestId'
        api_key:
          type: string
          description: API key for programmatic access
      examples:
        - type: authenticate
          api_key: "il_key_abc123..."

    AuthenticatedResponse:
      type: object
      required:
        - type
        - session_id
        - knowledge_graph
        - version
        - role
        - protocol_version
        - stream_epoch
      properties:
        type:
          type: string
          const: authenticated
        id:
          $ref: '#/components/schemas/RequestId'
        session_id:
          type: string
          description: Auto-created session ID
        knowledge_graph:
          type: string
          description: Initial knowledge graph the session is bound to
        version:
          type: string
          description: Server version string
        role:
          type: string
          description: Authenticated user's role (admin, writer, reader)
        protocol_version:
          type: integer
          description: Version of this protocol the server speaks (2)
        stream_epoch:
          type: string
          description: |
            Id of this engine run. Notification `seq` numbers and knowledge graph
            revisions belong to it; pass it back as `epoch` with `last_seq` on reconnect.
      examples:
        - type: authenticated
          id: "1"
          protocol_version: 2
          stream_epoch: 3f9c2a7e01b4d865
          session_id: "42"
          knowledge_graph: default
          version: "0.1.0"
          role: admin

    AuthErrorResponse:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
          const: auth_error
        id:
          $ref: '#/components/schemas/RequestId'
        message:
          type: string
          description: Human-readable authentication error
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: |
            `access_denied` when the credential is valid but may not use the
            knowledge graph. Absent for failed credentials.
      examples:
        - type: auth_error
          message: "Invalid username or password"
        - type: auth_error
          message: "Access denied"
          code: access_denied

    ResultResponse:
      type: object
      required:
        - type
        - columns
        - rows
        - row_count
        - total_count
        - truncated
        - execution_time_ms
        - errors
      properties:
        type:
          type: string
          const: result
        id:
          $ref: '#/components/schemas/RequestId'
        columns:
          type: array
          items:
            type: string
          description: Column names from the result schema
        rows:
          type: array
          items:
            type: array
            items: {}
          description: Result rows, each row is an array of values
        row_count:
          type: integer
          description: Number of rows returned
        total_count:
          type: integer
          description: Total number of rows (before truncation)
        truncated:
          type: boolean
          description: Whether the result was truncated
        execution_time_ms:
          type: integer
          format: int64
          description: Execution time in milliseconds
        row_provenance:
          type: array
          items:
            type: string
          description: |
            Per-row provenance. Values include "persistent", "ephemeral", "mixed",
            or "unknown" when provenance cannot be determined.
        metadata:
          $ref: '#/components/schemas/SessionQueryMetadata'
        switched_kg:
          type: string
          description: |
            Present when the command switched the session's knowledge graph
            (e.g., after `.kg use <name>` or `.kg create <name>`).
            The client should update its local KG tracking.
        proof_trees:
          type: array
          items: {}
          description: Derivations of a `.why` result
        timing_breakdown:
          type: object
          description: Per-stage execution timing in microseconds
        errors:
          type: array
          items:
            $ref: '#/components/schemas/StatementError'
          description: Failed statements of the program; empty when every statement succeeded
        statements:
          type: array
          items:
            $ref: '#/components/schemas/StatementCounts'
          description: |
            Fact statements the program committed, with their counts, in
            program order. Absent when the program committed no fact statement
            (a read, a failed program, or only schema and rule changes).
        revision:
          type: integer
          format: int64
          description: |
            Knowledge graph revision the program's committed writes are visible at,
            the revision pushes carry: a delta at this revision or later reflects them.
            Present only when the program changed persistent state of a knowledge graph;
            see the WebSocket API guide for which statements carry it. Comparable only
            within one knowledge graph and stream epoch.
        subscribed:
          $ref: '#/components/schemas/Subscribed'
          description: Set on the reply to `.subscribe`, whose `rows` are the snapshot
      examples:
        - type: result
          id: "2"
          columns: ["col0", "col1"]
          rows: [[1, 2], [3, 4]]
          row_count: 2
          total_count: 2
          truncated: false
          execution_time_ms: 5
        - type: result
          columns: ["message"]
          rows: [["Switched to knowledge graph: test"]]
          row_count: 1
          total_count: 1
          truncated: false
          execution_time_ms: 1
          switched_kg: test

    ErrorResponse:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
          const: error
        id:
          $ref: '#/components/schemas/RequestId'
        message:
          type: string
          description: |
            Human-readable error message. An `error` always answers a request;
            connection events are `notice` frames.
        validation_errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
          description: Detailed validation errors (present for parse/validation errors)
        code:
          $ref: '#/components/schemas/ErrorCode'
      examples:
        - type: error
          id: "3"
          message: "Program has 1 parse error(s)"
          code: validation
        - type: error
          id: "4"
          message: "Knowledge graph 'missing' not found"
          code: not_found
        - type: error
          message: "Invalid message format: request id is empty"
          code: invalid_request

    ResultStartResponse:
      type: object
      required:
        - type
        - columns
        - total_count
        - truncated
        - execution_time_ms
      properties:
        type:
          type: string
          const: result_start
        id:
          $ref: '#/components/schemas/RequestId'
        columns:
          type: array
          items:
            type: string
          description: Column names from the result schema
        total_count:
          type: integer
          description: Total number of rows across all chunks
        truncated:
          type: boolean
          description: Whether the result was truncated
        execution_time_ms:
          type: integer
          format: int64
          description: Execution time in milliseconds
        metadata:
          $ref: '#/components/schemas/SessionQueryMetadata'
        switched_kg:
          type: string
          description: Present when the command switched the session's knowledge graph
        proof_trees:
          type: array
          items: {}
        timing_breakdown:
          type: object
        errors:
          type: array
          items:
            $ref: '#/components/schemas/StatementError'
        statements:
          type: array
          items:
            $ref: '#/components/schemas/StatementCounts'
        revision:
          type: integer
          format: int64
        subscribed:
          $ref: '#/components/schemas/Subscribed'
      examples:
        - type: result_start
          columns: ["id", "name", "score"]
          total_count: 50000
          truncated: false
          execution_time_ms: 120

    ResultChunkResponse:
      type: object
      required:
        - type
        - rows
        - chunk_index
      properties:
        type:
          type: string
          const: result_chunk
        id:
          $ref: '#/components/schemas/RequestId'
        rows:
          type: array
          items:
            type: array
            items: {}
          description: Result rows in this chunk (at most 500 rows and about 1 MiB)
        row_provenance:
          type: array
          items:
            type: string
          description: Per-row provenance for this chunk
        chunk_index:
          type: integer
          description: 0-based chunk sequence number
      examples:
        - type: result_chunk
          rows: [[1, "alice", 95], [2, "bob", 87]]
          chunk_index: 0

    ResultEndResponse:
      type: object
      required:
        - type
        - row_count
        - chunk_count
      properties:
        type:
          type: string
          const: result_end
        id:
          $ref: '#/components/schemas/RequestId'
        row_count:
          type: integer
          description: Total number of rows sent across all chunks
        chunk_count:
          type: integer
          description: Number of chunks that were sent
      examples:
        - type: result_end
          row_count: 50000
          chunk_count: 100

    PongResponse:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: pong
        id:
          $ref: '#/components/schemas/RequestId'
      examples:
        - type: pong

    CancelAckResponse:
      type: object
      required:
        - type
        - target
        - outcome
      properties:
        type:
          type: string
          const: cancel_ack
        id:
          $ref: '#/components/schemas/RequestId'
        target:
          $ref: '#/components/schemas/RequestId'
        outcome:
          type: string
          enum: [cancelled, too_late, not_found]
      examples:
        - type: cancel_ack
          id: "c1"
          target: "42"
          outcome: cancelled

    NotificationResponse:
      type: object
      required:
        - type
        - seq
        - timestamp_ms
      discriminator: type
      description: |
        Push notification for data/schema/rule/KG changes. The `type` field
        discriminates the event kind. All notifications carry a `seq` number,
        strictly increasing in delivery order within the stream epoch, for replay on
        reconnect (see the `last_seq` and `epoch` query params).
        A session receives changes to its own knowledge graph; `kg_change` for
        other knowledge graphs is sent to admin sessions only. Changes to
        `_internal` are never sent, nor changes to a knowledge graph the user's
        access to was revoked (`.kg acl revoke`). Replay applies the same rules.
      properties:
        type:
          type: string
          enum: [persistent_update, rule_change, kg_change, schema_change]
          description: Event type discriminator
        seq:
          type: integer
          format: int64
          description: |
            Position in the stream epoch's notification stream (1-based, strictly
            increasing in delivery order). Unrelated to a subscription's `seq`.
        timestamp_ms:
          type: integer
          format: int64
          description: Server timestamp in milliseconds since Unix epoch
        session_id:
          type: string
          description: Session that triggered the change (if applicable)
        knowledge_graph:
          type: string
          description: Knowledge graph where the change occurred

        # persistent_update fields
        relation:
          type: string
          description: "Relation that was modified (persistent_update only)"
        operation:
          type: string
          description: |
            Type of operation. Values depend on event type:
            - persistent_update: "insert", "delete"
            - rule_change: "registered", "removed", "dropped"
            - kg_change: "created", "dropped"
            - schema_change: "created", "dropped"
        count:
          type: integer
          description: "Number of tuples affected (persistent_update only)"

        # rule_change fields
        rule_name:
          type: string
          description: "Name of the rule (rule_change only)"

        # schema_change fields
        entity:
          type: string
          description: "Name of the schema entity (schema_change only)"
      examples:
        - type: persistent_update
          knowledge_graph: default
          relation: edge
          operation: insert
          count: 5
          seq: 42
          timestamp_ms: 1708732800000
        - type: rule_change
          knowledge_graph: default
          rule_name: reachable
          operation: registered
          seq: 43
          timestamp_ms: 1708732801000
        - type: kg_change
          knowledge_graph: analytics
          operation: created
          seq: 44
          timestamp_ms: 1708732802000
        - type: schema_change
          knowledge_graph: default
          entity: users
          operation: created
          seq: 45
          timestamp_ms: 1708732803000

    ValidationError:
      type: object
      required:
        - line
        - statement_index
        - error
      properties:
        line:
          type: integer
          description: 1-based line number in the original program text
        statement_index:
          type: integer
          description: 0-based index of the statement (counting only non-empty lines)
        error:
          type: string
          description: The parse error message

    SessionQueryMetadata:
      type: object
      properties:
        has_ephemeral:
          type: boolean
          description: Whether the result includes ephemeral (session-scoped) data
        ephemeral_sources:
          type: array
          items:
            type: string
          description: Relations that contributed ephemeral data to the result
        warnings:
          type: array
          items:
            type: string
          description: Any warnings generated during query execution

  # HTTP Endpoints (not WebSocket, documented here for completeness)
  # These are served alongside the WebSocket endpoint on the same port.
  x-http-endpoints:
    health:
      method: GET
      path: /health
      description: Health check endpoint. Returns 200 with JSON body.
      response:
        type: object
        properties:
          status:
            type: string
            const: healthy
    metrics:
      method: GET
      path: /metrics
      description: Server statistics endpoint. Returns query counts, uptime, and KG info.

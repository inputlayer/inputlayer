servers:
  development:
    host: localhost:8080
    protocol: ws
    pathname: /ws
    description: Local development server

channels:
  ws:
    address: /ws
    description: |
      Global WebSocket endpoint with auto-session lifecycle.
      Query parameter `kg` sets the initial knowledge graph (default: "default").
    parameters:
      kg:
        description: Knowledge graph to bind to on connect
        default: default
      last_seq:
        description: |
          Last notification `seq` the client saw, for replay on reconnect. With the
          matching `epoch`, the server replays the retained notifications with a higher
          seq before live ones; otherwise it sends one `replay_gap` notice and replays
          nothing.
      epoch:
        description: |
          The `stream_epoch` from `authenticated` that `last_seq` belongs to. A cursor
          without it, or from another engine run, gets `replay_gap`.
    messages:
      # Client → Server (auth)
      login:
        $ref: '#/components/messages/Login'
      authenticate:
        $ref: '#/components/messages/Authenticate'
      # Client → Server (operations)
      execute:
        $ref: '#/components/messages/Execute'
      read:
        $ref: '#/components/messages/Read'
      subscribe:
        $ref: '#/components/messages/Subscribe'
      ping:
        $ref: '#/components/messages/Ping'
      cancel:
        $ref: '#/components/messages/Cancel'
      # Server → Client (auth)
      authenticated:
        $ref: '#/components/messages/Authenticated'
      auth_error:
        $ref: '#/components/messages/AuthError'
      # Server → Client (results)
      result:
        $ref: '#/components/messages/Result'
      result_start:
        $ref: '#/components/messages/ResultStart'
      result_chunk:
        $ref: '#/components/messages/ResultChunk'
      result_end:
        $ref: '#/components/messages/ResultEnd'
      snapshot:
        $ref: '#/components/messages/Snapshot'
      snapshot_start:
        $ref: '#/components/messages/SnapshotStart'
      snapshot_chunk:
        $ref: '#/components/messages/SnapshotChunk'
      snapshot_end:
        $ref: '#/components/messages/SnapshotEnd'
      error:
        $ref: '#/components/messages/Error'
      pong:
        $ref: '#/components/messages/Pong'
      cancel_ack:
        $ref: '#/components/messages/CancelAck'
      notification:
        $ref: '#/components/messages/Notification'
      subscription_delta:
        $ref: '#/components/messages/SubscriptionDelta'
      subscription_delta_start:
        $ref: '#/components/messages/SubscriptionDeltaStart'
      subscription_delta_chunk:
        $ref: '#/components/messages/SubscriptionDeltaChunk'
      subscription_delta_end:
        $ref: '#/components/messages/SubscriptionDeltaEnd'
      subscription_group_delta:
        $ref: '#/components/messages/SubscriptionGroupDelta'
      subscription_group_delta_start:
        $ref: '#/components/messages/SubscriptionGroupDeltaStart'
      subscription_group_delta_chunk:
        $ref: '#/components/messages/SubscriptionGroupDeltaChunk'
      subscription_group_delta_end:
        $ref: '#/components/messages/SubscriptionGroupDeltaEnd'
      subscription_error:
        $ref: '#/components/messages/SubscriptionError'
      subscription_reset:
        $ref: '#/components/messages/SubscriptionReset'
      notice:
        $ref: '#/components/messages/Notice'

operations:
  login:
    action: send
    channel:
      $ref: '#/channels/ws'
    summary: Authenticate with username and password
    description: |
      Must be the first message after WebSocket upgrade. The server responds with
      `authenticated` on success or `auth_error` on failure.
    messages:
      - $ref: '#/channels/ws/messages/login'

  authenticate:
    action: send
    channel:
      $ref: '#/channels/ws'
    summary: Authenticate with an API key
    description: |
      Alternative to `login` for programmatic access. The server responds with
      `authenticated` on success or `auth_error` on failure.
    messages:
      - $ref: '#/channels/ws/messages/authenticate'

  execute:
    action: send
    channel:
      $ref: '#/channels/ws'
    summary: Execute a IQL statement or meta command
    description: |
      Send any valid IQL statement or meta command as raw text.

      **Supported statement types:**
      - `+relation[(v1, v2), ...]` - Insert persistent facts
      - `relation(v1, v2)` - Insert session-scoped (ephemeral) fact
      - `-relation(X, Y) <- condition` - Delete facts matching condition
      - `?relation(X, Y)` - Query a relation
      - `+rule(X, Y) <- body(X, Y)` - Add persistent rule
      - `rule(X, Y) <- body(X, Y)` - Add session-scoped rule

      **Meta commands:**
      - `.kg list` / `.kg create <name>` / `.kg use <name>` / `.kg drop <name>` - KG management
      - `.kg acl list` / `.kg acl grant <kg> <user> <role>` / `.kg acl revoke <kg> <user>` - Access control
      - `.user list` / `.user create` / `.user drop` / `.user password` / `.user role` - User management
      - `.apikey list` / `.apikey create <label> [<ttl>]` / `.apikey expire <label> <ttl>` / `.apikey revoke <label>` - API key management
      - `.rel` / `.rel <name>` / `.rel drop <name>` - List / describe / drop relations
      - `.rule list` / `.rule show <name>` / `.rule drop <name>` - Rule management
      - `.rule drop prefix <prefix>` - Drop rules by prefix
      - `.rule remove <name> <index>` - Remove specific rule clause
      - `.session list` / `.session clear` - Session management
      - `.index list` / `.index create ...` / `.index drop <name>` - Index management
      - `.clear prefix <prefix>` - Clear relations by prefix
      - `.debug <query>` - Show query plan without executing
      - `.subscribe <id> ?<query>` / `.unsubscribe <id>` - Standing queries (replies with the initial snapshot; pushes `subscription_delta`); `.unsubscribe` also ends a subscription group
      - `.help` - Show available commands
      - `.status` - Server status
      - `.compact` - Trigger compaction
    messages:
      - $ref: '#/channels/ws/messages/execute'

  read:
    action: send
    channel:
      $ref: '#/channels/ws'
    summary: Read several queries at one revision
    description: |
      Answered by one `snapshot` holding every named query's result, all exact at its
      `revision`, or one `error` naming the failing query. Persistent data only. See
      "Snapshot reads and subscription groups".
    messages:
      - $ref: '#/channels/ws/messages/read'

  subscribe:
    action: send
    channel:
      $ref: '#/channels/ws'
    summary: Subscribe to a group of queries kept current together
    description: |
      Answered by a `snapshot` of every member at one revision, with `subscribed`;
      then `subscription_group_delta` pushes, each leaving every member exact at its
      revision. See "Snapshot reads and subscription groups".
    messages:
      - $ref: '#/channels/ws/messages/subscribe'

  onSnapshot:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Several query results at one revision
    description: |
      The reply to `read`, and to `subscribe` (then with `subscribed`). `results` is in
      request order. A read's result may be cut at `max_result_rows` (`truncated`); a
      group's snapshot never is: a capped member fails the `subscribe` instead.
    messages:
      - $ref: '#/channels/ws/messages/snapshot'

  onSnapshotStart:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Start of a streamed snapshot
    description: |
      Sent instead of `snapshot` when it would exceed 1 MiB: every result's name,
      columns and row count. Followed by `snapshot_chunk`s and a `snapshot_end`; the
      snapshot is complete only at its end. An `error` with the same `id` instead ends
      the stream as failed: discard the rows received.
    messages:
      - $ref: '#/channels/ws/messages/snapshot_start'

  onSnapshotChunk:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Rows of one result of a streamed snapshot
    description: |
      At most 500 rows and about 1 MiB, of the result at index `result`. `chunk_index`
      counts from 0 across all results without gaps; results stream in order, and a
      result without rows has no chunks.
    messages:
      - $ref: '#/channels/ws/messages/snapshot_chunk'

  onSnapshotEnd:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: End of a streamed snapshot
    description: |
      The number of chunks sent. Each result's chunks must add up to the `row_count`
      its header announced; only now is the snapshot complete.
    messages:
      - $ref: '#/channels/ws/messages/snapshot_end'

  onSubscriptionGroupDelta:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Change to a subscription group's results
    description: |
      One per refresh that changed any member. Lists every member in the group's
      order; `unchanged` marks a member whose result did not change. After applying
      it, every member is its query's exact answer at `revision`. `seq` starts at 1 per
      group and has no gaps; `revision` increases with every push. A push whose frame
      would exceed 1 MiB is streamed instead (`subscription_group_delta_start`).
    messages:
      - $ref: '#/channels/ws/messages/subscription_group_delta'

  onSubscriptionGroupDeltaStart:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Start of a group delta streamed in chunks
    description: |
      Everything a `subscription_group_delta` carries but its rows, with each member's
      row counts. Followed by `subscription_group_delta_chunk`s and a
      `subscription_group_delta_end` for the same subscription, generation and `seq`;
      together they are that one push. Other frames may arrive in between. Apply it
      only at its end.
    messages:
      - $ref: '#/channels/ws/messages/subscription_group_delta_start'

  onSubscriptionGroupDeltaChunk:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Rows of one member of a streamed group delta
    description: |
      At most 500 rows and about 1 MiB, of the member at index `member`. `chunk_index`
      counts from 0 across all members without gaps; members stream in order. A
      missing, repeated or out-of-order chunk means the stream is broken: drop the
      group's rows and subscribe again.
    messages:
      - $ref: '#/channels/ws/messages/subscription_group_delta_chunk'

  onSubscriptionGroupDeltaEnd:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: End of a streamed group delta
    description: |
      The number of chunks sent. Each member's chunks must add up to the counts its
      header announced; only now does the push apply.
    messages:
      - $ref: '#/channels/ws/messages/subscription_group_delta_end'

  ping:
    action: send
    channel:
      $ref: '#/channels/ws'
    summary: Keep-alive ping
    messages:
      - $ref: '#/channels/ws/messages/ping'

  cancel:
    action: send
    channel:
      $ref: '#/channels/ws'
    summary: Cancel an unanswered request by its id
    description: |
      Acts on arrival; answered by `cancel_ack`. See "Deadlines and cancellation".
    messages:
      - $ref: '#/channels/ws/messages/cancel'

  onCancelAck:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: What a cancel did to its target
    messages:
      - $ref: '#/channels/ws/messages/cancel_ack'

  onAuthenticated:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Authentication success
    description: |
      Sent after a successful `login` or `authenticate` message.
      Contains the session ID, initial knowledge graph, server version, and user role.
    messages:
      - $ref: '#/channels/ws/messages/authenticated'

  onAuthError:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Authentication failure
    description: Sent when a `login` or `authenticate` message fails. The client may retry.
    messages:
      - $ref: '#/channels/ws/messages/auth_error'

  onResult:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Command/query result
    messages:
      - $ref: '#/channels/ws/messages/result'

  onError:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Error response
    messages:
      - $ref: '#/channels/ws/messages/error'

  onResultStart:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Start of a streamed result
    description: |
      Sent instead of `result` when the serialized result exceeds 1 MiB, including
      the reply to `.subscribe` (then with `subscribed`). Contains metadata and column
      names. Followed by `result_chunk` messages, then a `result_end` message; the
      result is complete only at `result_end`. An `error` with the same `id` instead
      ends the stream as failed: discard the rows received.
    messages:
      - $ref: '#/channels/ws/messages/result_start'

  onResultChunk:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Chunk of streamed result rows
    description: |
      Contains at most 500 rows and about 1 MiB. Chunks are numbered sequentially
      starting from 0 via `chunk_index`.
    messages:
      - $ref: '#/channels/ws/messages/result_chunk'

  onResultEnd:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: End of a streamed result
    description: |
      Signals that all chunks have been sent. Its row and chunk counts are what the
      chunks must add up to; only now is the result complete.
    messages:
      - $ref: '#/channels/ws/messages/result_end'

  onPong:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Pong response to keep-alive
    messages:
      - $ref: '#/channels/ws/messages/pong'

  onNotification:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Push notification for persistent data changes
    description: |
      Sent when persistent data changes in the session's currently bound knowledge graph.
      Notifications are filtered to only include changes for the session's active KG.
    messages:
      - $ref: '#/channels/ws/messages/notification'

  onSubscriptionDelta:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Change to a standing query's result
    description: |
      Pushed after a committed persistent change to a relation the subscribed
      query depends on (directly or through persistent rules) altered its result.
      Set semantics; `seq` starts at 1 per subscription and has no gaps; `revision`
      increases with every delta. Persistent data only. A delta whose frame would
      exceed 1 MiB is streamed instead (`subscription_delta_start`).
    messages:
      - $ref: '#/channels/ws/messages/subscription_delta'

  onSubscriptionDeltaStart:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Start of a delta streamed in chunks
    description: |
      Everything a `subscription_delta` carries but its rows. Followed by
      `subscription_delta_chunk`s and a `subscription_delta_end` for the same
      subscription, generation and `seq`; together they are that one delta. Other
      frames may arrive in between. Apply the delta only at its end.
    messages:
      - $ref: '#/channels/ws/messages/subscription_delta_start'

  onSubscriptionDeltaChunk:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Rows of a streamed delta
    description: |
      At most 500 rows and about 1 MiB, numbered from `chunk_index` 0 without gaps.
      A missing, repeated or out-of-order chunk means the stream is broken: drop the
      subscription's rows and resubscribe.
    messages:
      - $ref: '#/channels/ws/messages/subscription_delta_chunk'

  onSubscriptionDeltaEnd:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: End of a streamed delta
    description: |
      The chunk and row counts the chunks must add up to. Only now does the delta
      apply, advancing the subscription to the start frame's `seq` and `revision`.
    messages:
      - $ref: '#/channels/ws/messages/subscription_delta_end'

  onSubscriptionReset:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: The server ended a subscription it could not keep current
    description: |
      The subscription's next change could not be delivered whole (a row larger than
      any frame), so the server removed the subscription. Discard its rows, including a streamed delta in
      progress, and subscribe again for a fresh snapshot. Nothing more is pushed for
      this generation.
    messages:
      - $ref: '#/channels/ws/messages/subscription_reset'

  onNotice:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Connection event
    description: |
      Sent unprompted, never as a reply and never with an `id`. All codes but
      `notifications_missed` and `replay_gap` are followed by the server closing the connection;
      `credential_revoked` is the last frame of a revoked connection, and
      `credential_expired` of one whose API key expired.
    messages:
      - $ref: '#/channels/ws/messages/notice'

  onSubscriptionError:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Standing query re-evaluation failed or was denied
    description: |
      The subscription stays registered and keeps the last result it received;
      the next delta is relative to it. For a group, the refresh failed as a whole:
      every member keeps its last result. A result cut at `max_result_rows`, and
      a result the subscriber may no longer read (`.kg acl revoke`), are
      reported this way instead of being delivered.
    messages:
      - $ref: '#/channels/ws/messages/subscription_error'

components:
  messages:
    Execute:
      name: execute
      title: Execute Command
      summary: Execute any IQL statement or meta command
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ExecuteRequest'

    Read:
      name: read
      title: Read
      summary: Read several queries at one revision
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReadRequest'

    Subscribe:
      name: subscribe
      title: Subscribe
      summary: Subscribe to a group of queries kept current together
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscribeRequest'

    Snapshot:
      name: snapshot
      title: Snapshot
      summary: Several query results at one revision
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SnapshotResponse'

    SnapshotStart:
      name: snapshot_start
      title: Snapshot Start
      summary: Header of a snapshot streamed in chunks
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SnapshotStartResponse'

    SnapshotChunk:
      name: snapshot_chunk
      title: Snapshot Chunk
      summary: Rows of one result of a streamed snapshot
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SnapshotChunkResponse'

    SnapshotEnd:
      name: snapshot_end
      title: Snapshot End
      summary: End of a streamed snapshot
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SnapshotEndResponse'

    SubscriptionGroupDelta:
      name: subscription_group_delta
      title: Subscription Group Delta
      summary: Every member of a subscription group at a new revision
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptionGroupDeltaResponse'

    SubscriptionGroupDeltaStart:
      name: subscription_group_delta_start
      title: Subscription Group Delta Start
      summary: Header of a group delta streamed in chunks
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptionGroupDeltaStartResponse'

    SubscriptionGroupDeltaChunk:
      name: subscription_group_delta_chunk
      title: Subscription Group Delta Chunk
      summary: Rows of one member of a streamed group delta
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptionGroupDeltaChunkResponse'

    SubscriptionGroupDeltaEnd:
      name: subscription_group_delta_end
      title: Subscription Group Delta End
      summary: End of a streamed group delta
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptionGroupDeltaEndResponse'

    Ping:
      name: ping
      title: Ping
      summary: Keep-alive ping
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PingRequest'

    Cancel:
      name: cancel
      title: Cancel
      summary: Cancel an unanswered request by its id
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CancelRequest'

    Login:
      name: login
      title: Login
      summary: Authenticate with username and password
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LoginRequest'

    Authenticate:
      name: authenticate
      title: Authenticate
      summary: Authenticate with an API key
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AuthenticateRequest'

    Authenticated:
      name: authenticated
      title: Authenticated
      summary: Authentication succeeded
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AuthenticatedResponse'

    AuthError:
      name: auth_error

# Same-host performance gate: drives real `inputlayer-server` binaries over
# `/ws` and compares a candidate with the approved baseline. A standalone
# workspace (excluded from the engine's) so bench-only dependencies never
# reach the engine crate or the release image.
[workspace]

[package]
name = "inputlayer-perf-gate"
version = "0.1.0"
edition = "2021"
description = "InputLayer performance gate: paired baseline/candidate latency and throughput over the engine WebSocket"
license = "Elastic-2.0"
repository = "https://github.com/inputlayer/inputlayer"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
tokio-tungstenite = "0.24"
toml = "0.8"

[[bin]]
name = "perf-gate"
path = "src/main.rs"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
# clippy 1.99: its `assert_eq!(x, [] as [T; 0])` rewrite is noisier than `assert!(x.is_empty())`.
assert_is_empty = "allow"

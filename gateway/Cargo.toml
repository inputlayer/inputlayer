[package]
name = "inputlayer-gateway"
version = "0.1.0"
edition = "2021"
description = "InputLayer Gateway - the model gateway for Verified Completions"
license = "Elastic-2.0"
repository = "https://github.com/inputlayer/inputlayer"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
chrono = "0.4"
inputlayer-ontology-client = { path = "../ontology-client", version = "0.1.0" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"

[[bin]]
name = "inputlayer-gateway"
path = "src/main.rs"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
missing_errors_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
format_push_string = "allow"
option_option = "allow"
needless_pass_by_value = "allow"
single_match_else = "allow"
doc_markdown = "allow"

apiVersion: v1
kind: ConfigMap
metadata:
  name: inputlayer-config
  labels:
    app.kubernetes.io/name: inputlayer
    app.kubernetes.io/component: engine
data:
  # Mounted at /etc/inputlayer/config.toml and passed with --config.
  #
  # INPUTLAYER_* environment variables override this file. The engine image
  # sets http.host, http.port, storage.data_dir, logging.level and
  # storage.auto_create_knowledge_graphs as environment variables, so those
  # keys are set in statefulset.yaml, not here.
  config.toml: |
    [storage.persist]
    enabled = true
    durability_mode = "immediate"

    [storage.performance]
    # 0 = one worker per CPU the process sees (the whole node when no CPU
    # limit is set). Set it to the CPUs requested in statefulset.yaml.
    num_threads = 0
    # Memory limits, refused with `resource_exhausted` rather than grown
    # into, sized for the 4Gi memory limit in statefulset.yaml:
    # - max_total_query_memory_bytes (unset here) is what all running
    #   queries may hold together: half the pod's limit, 2 GiB. However many
    #   queries the CPUs admit at once, together they stop there.
    # - The other 2 GiB hold the graphs' stored facts and the server: up to
    #   three graphs at their full max_graph_memory_bytes.
    # - A query copies the facts it reads while it evaluates, so the
    #   per-query limit is twice the graph budget: a query scanning a whole
    #   graph inside its budget fits, and two such queries run at once.
    # Raising the pod's limit raises the query budget with it; raise the
    # graph budget and the per-query limit together, keeping that ratio.
    max_query_memory_bytes = 1073741824 # 1 GiB
    max_graph_memory_bytes = 536870912 # 512 MiB

    [logging]
    format = "json"

    [http]
    # Keep below terminationGracePeriodSeconds in statefulset.yaml.
    shutdown_timeout_secs = 30
    # Behind an Ingress every request arrives from the ingress controller.
    # List the controller's pod CIDR here so per-IP rate limits and the
    # pre-auth WebSocket cap apply to real clients, not to the controller.
    # Empty: the client IP is always the TCP peer.
    trusted_proxies = []

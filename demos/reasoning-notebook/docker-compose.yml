services:
  engine:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - INPUTLAYER_URL=ws://engine:8080/ws
      - FRONTEND_ORIGIN=http://localhost:5173
    depends_on:
      engine:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

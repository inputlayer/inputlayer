<svg xmlns="http://www.w3.org/2000/svg" class="vkc" viewBox="0 0 760 1270" width="100%" role="img" aria-labelledby="vkc-t vkc-d" preserveAspectRatio="xMidYMid meet"><title id="vkc-t">The cascade as one pipeline around the graph</title><desc id="vkc-d">One voicestack pipeline from microphone to loudspeaker: VAD, STT, barge-in, intent gate, agenda, realizer, TTS, pump. The system lane carries Interrupt from the barge-in stage and from the agenda downstream. The intent gate, the agenda and the pump exchange programs and deltas with InputLayer; adapters and the watchdog write world facts; a separate executor process consumes work deltas and calls tools.</desc>
<style>
  .vkc { --fb-fg:#e9ecf3; --fb-muted:#a3abbc; --fb-line:#3a4050; --fb-card:#1b1e26; --fb-engine:#3fc8db; --fb-model:#a797ff; --fb-app:#b3bbcc; --fb-ext:#e3ac4f; --fb-ctl:#ff7f5e; --fb-ok:#62d48f; }
  @media (prefers-color-scheme: light) { .vkc { --fb-fg:#1a1d26; --fb-muted:#5c6475; --fb-line:#cfd4df; --fb-card:#f7f8fb; --fb-engine:#0b8fa3; --fb-model:#5d49e0; --fb-app:#5a6479; --fb-ext:#a86d12; --fb-ctl:#cf4a30; --fb-ok:#23924f; } }
  .vkc text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--foreground, var(--fb-fg)); }
  .vkc .muted { fill: var(--muted-foreground, var(--fb-muted)); }
  .vkc .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .vkc .ttl { font-weight: 600; }
  .vkc .b { fill: var(--card, var(--fb-card)); stroke: var(--border, var(--fb-line)); stroke-width: 1.6; }
  .vkc .engine { stroke: var(--primary, var(--fb-engine)); }
  .vkc .model { stroke: var(--accent, var(--fb-model)); }
  .vkc .app { stroke: var(--muted-foreground, var(--fb-app)); }
  .vkc .ext { stroke: var(--warning, var(--fb-ext)); }
  .vkc .ctl { stroke: var(--destructive, var(--fb-ctl)); }
  .vkc .ok { stroke: var(--success, var(--fb-ok)); }
  .vkc .tint-engine { fill: var(--primary, var(--fb-engine)); fill-opacity: .13; }
  .vkc .tint-model { fill: var(--accent, var(--fb-model)); fill-opacity: .13; }
  .vkc .tint-ext { fill: var(--warning, var(--fb-ext)); fill-opacity: .13; }
  .vkc .tint-ctl { fill: var(--destructive, var(--fb-ctl)); fill-opacity: .12; }
  .vkc .tint-ok { fill: var(--success, var(--fb-ok)); fill-opacity: .12; }
  .vkc .lane { fill: none; stroke: var(--border, var(--fb-line)); stroke-width: 1.2; stroke-dasharray: 6 5; }
  .vkc .ln { fill: none; stroke: var(--muted-foreground, var(--fb-muted)); stroke-width: 2; }
  .vkc .ln.engine { stroke: var(--primary, var(--fb-engine)); } .vkc .ln.ctl { stroke: var(--destructive, var(--fb-ctl)); } .vkc .ln.ok { stroke: var(--success, var(--fb-ok)); } .vkc .ln.ext { stroke: var(--warning, var(--fb-ext)); } .vkc .ln.model { stroke: var(--accent, var(--fb-model)); }
  .vkc .dash { stroke-dasharray: 7 5; }
  .vkc .axis { stroke: var(--border, var(--fb-line)); stroke-width: 2; }
  .vkc .m-muted { fill: var(--muted-foreground, var(--fb-muted)); } .vkc .m-engine { fill: var(--primary, var(--fb-engine)); } .vkc .m-ctl { fill: var(--destructive, var(--fb-ctl)); } .vkc .m-ok { fill: var(--success, var(--fb-ok)); } .vkc .m-ext { fill: var(--warning, var(--fb-ext)); } .vkc .m-model { fill: var(--accent, var(--fb-model)); }
</style>
<defs><marker id="vkc-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="vkc-a-engine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-engine"/></marker><marker id="vkc-a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-ctl"/></marker><marker id="vkc-a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-ok"/></marker><marker id="vkc-a-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-model"/></marker><marker id="vkc-a-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-ext"/></marker></defs><text x="24" y="38" font-size="22" text-anchor="start" class="ttl">The cascade as one pipeline around the graph</text><text x="24" y="62" font-size="14" text-anchor="start" class="muted">Every model stays in the lane. The graph is beside the lane, not in it.</text><rect x="40" y="104" width="250" height="66" rx="10" class="b app"/><text x="165.0" y="129" font-size="16" text-anchor="middle" class="ttl">Mic + resampler</text><text x="165.0" y="150.0" font-size="14" text-anchor="middle" class="muted">capture, 16 kHz mono</text><rect x="40" y="198" width="250" height="66" rx="10" class="b model"/><rect x="40" y="198" width="250" height="66" rx="10" class="tint-model" stroke="none"/><text x="165.0" y="223" font-size="16" text-anchor="middle" class="ttl">VAD</text><text x="165.0" y="244.0" font-size="14" text-anchor="middle" class="muted">speech and interruption edges</text><rect x="40" y="292" width="250" height="66" rx="10" class="b model"/><rect x="40" y="292" width="250" height="66" rx="10" class="tint-model" stroke="none"/><text x="165.0" y="317" font-size="16" text-anchor="middle" class="ttl">Streaming STT</text><text x="165.0" y="338.0" font-size="14" text-anchor="middle" class="muted">partials with a stable prefix</text><rect x="40" y="386" width="250" height="66" rx="10" class="b ctl"/><rect x="40" y="386" width="250" height="66" rx="10" class="tint-ctl" stroke="none"/><text x="165.0" y="411" font-size="16" text-anchor="middle" class="ttl">Barge-in stage</text><text x="165.0" y="432.0" font-size="14" text-anchor="middle" class="muted">speech onset → Interrupt</text><rect x="40" y="480" width="250" height="66" rx="10" class="b app"/><text x="165.0" y="505" font-size="16" text-anchor="middle" class="ttl">Intent stage + write gate</text><text x="165.0" y="526.0" font-size="14" text-anchor="middle" class="muted">model proposes; gate commits</text><rect x="42" y="488" width="6" height="50" rx="3" class="m-model"/><rect x="40" y="574" width="250" height="66" rx="10" class="b app"/><text x="165.0" y="599" font-size="16" text-anchor="middle" class="ttl">Agenda (active stage)</text><text x="165.0" y="620.0" font-size="14" text-anchor="middle" class="muted">view, floor, selection, commit check</text><rect x="40" y="668" width="250" height="66" rx="10" class="b app"/><text x="165.0" y="693" font-size="16" text-anchor="middle" class="ttl">Realizer</text><text x="165.0" y="714.0" font-size="14" text-anchor="middle" class="muted">templates · sanitizer · LLM</text><rect x="42" y="676" width="6" height="50" rx="3" class="m-model"/><rect x="40" y="762" width="250" height="66" rx="10" class="b model"/><rect x="40" y="762" width="250" height="66" rx="10" class="tint-model" stroke="none"/><text x="165.0" y="787" font-size="16" text-anchor="middle" class="ttl">Streaming TTS</text><text x="165.0" y="808.0" font-size="14" text-anchor="middle" class="muted">phrase → audio chunks</text><rect x="40" y="856" width="250" height="66" rx="10" class="b app"/><text x="165.0" y="881" font-size="16" text-anchor="middle" class="ttl">Pump (tail)</text><text x="165.0" y="902.0" font-size="14" text-anchor="middle" class="muted">device, last check, receipts</text><path d="M165.0,170 L165.0,198" class="ln muted" marker-end="url(#vkc-a-muted)"/><path d="M165.0,264 L165.0,292" class="ln muted" marker-end="url(#vkc-a-muted)"/><path d="M165.0,358 L165.0,386" class="ln muted" marker-end="url(#vkc-a-muted)"/><path d="M165.0,452 L165.0,480" class="ln muted" marker-end="url(#vkc-a-muted)"/><path d="M165.0,546 L165.0,574" class="ln muted" marker-end="url(#vkc-a-muted)"/><path d="M165.0,640 L165.0,668" class="ln muted" marker-end="url(#vkc-a-muted)"/><path d="M165.0,734 L165.0,762" class="ln muted" marker-end="url(#vkc-a-muted)"/><path d="M165.0,828 L165.0,856" class="ln muted" marker-end="url(#vkc-a-muted)"/><text x="40" y="94" font-size="13" text-anchor="start" class="muted">data lane ↓  audio · transcripts · edges · claim markers</text><path d="M290,419.0 L314,419.0 L314,889.0 L292,889.0" class="ln ctl" marker-end="url(#vkc-a-ctl)"/><text x="322" y="397.0" font-size="13" text-anchor="start" class="ctl ttl">system lane: Interrupt</text><text x="322" y="413.0" font-size="13" text-anchor="start" class="muted">from barge-in (speech onset)</text><text x="322" y="429.0" font-size="13" text-anchor="start" class="muted">and from the agenda; reaches</text><text x="322" y="445.0" font-size="13" text-anchor="start" class="muted">every stage downstream</text><path d="M290,630 L314,630" class="ln ctl" marker-end="url(#vkc-a-ctl)"/><rect x="440" y="470" width="290" height="190" rx="10" class="b engine"/><rect x="440" y="470" width="290" height="190" rx="10" class="tint-engine" stroke="none"/><text x="585.0" y="495" font-size="18" text-anchor="middle" class="ttl">InputLayer</text><text x="585.0" y="516.0" font-size="14" text-anchor="middle" class="muted">world · session · policy facts</text><text x="585.0" y="535.6" font-size="14" text-anchor="middle" class="muted">rules: claim · speech · work</text><text x="585.0" y="555.2" font-size="14" text-anchor="middle" class="muted">guarded programs, one revision each</text><text x="585.0" y="574.8" font-size="14" text-anchor="middle" class="muted">standing queries → deltas</text><text x="585.0" y="594.4" font-size="14" text-anchor="middle" class="muted">.why at the decision snapshot</text><rect x="440" y="104" width="290" height="96" rx="10" class="b app"/><text x="585.0" y="129" font-size="16" text-anchor="middle" class="ttl">Observation adapters</text><text x="585.0" y="150.0" font-size="14" text-anchor="middle" class="muted">carrier · orders · CRM</text><text x="585.0" y="169.6" font-size="14" text-anchor="middle" class="muted">replacement programs with cursors</text><rect x="440" y="232" width="290" height="96" rx="10" class="b app"/><text x="585.0" y="257" font-size="16" text-anchor="middle" class="ttl">Watchdog + leases</text><text x="585.0" y="278.0" font-size="14" text-anchor="middle" class="muted">flips source_health status; leases</text><text x="585.0" y="297.6" font-size="14" text-anchor="middle" class="muted">expire by the engine clock in guards</text><path d="M480,200 L480,218 L426,218 L426,490 L440,490" class="ln engine" marker-end="url(#vkc-a-engine)"/><text x="420" y="292" font-size="13" text-anchor="end" class="muted">replacement</text><text x="420" y="310" font-size="13" text-anchor="end" class="muted">programs</text><path d="M585.0,328 L585.0,470" class="ln engine" marker-end="url(#vkc-a-engine)"/><text x="595.0" y="400" font-size="13" text-anchor="start" class="muted">status flips</text><text x="585.0" y="94" font-size="13" text-anchor="middle" class="muted">external systems ↓</text><path d="M290,527.0 L470,527.0 L470,470" class="ln engine" marker-end="url(#vkc-a-engine)"/><text x="322" y="523.0" font-size="13" text-anchor="start" class="muted">goals, consents</text><path d="M440,592 L290,592" class="ln engine dash" marker-end="url(#vkc-a-engine)"/><text x="322" y="588" font-size="13" text-anchor="start" class="muted">speech deltas</text><path d="M290,614 L440,614" class="ln engine" marker-end="url(#vkc-a-engine)"/><text x="322" y="626" font-size="13" text-anchor="start" class="muted">reservations</text><path d="M290,872 L410,872 L410,640 L440,640" class="ln engine" marker-end="url(#vkc-a-engine)"/><text x="165.0" y="942" font-size="13" text-anchor="middle" class="muted">receipt programs → InputLayer</text><rect x="440" y="770" width="290" height="112" rx="10" class="b app"/><text x="585.0" y="795" font-size="16" text-anchor="middle" class="ttl">Executor (separate process)</text><text x="585.0" y="816.0" font-size="14" text-anchor="middle" class="muted">lease per session, guarded claims,</text><text x="585.0" y="835.6" font-size="14" text-anchor="middle" class="muted">idempotency keys, reconciliation,</text><text x="585.0" y="855.2" font-size="14" text-anchor="middle" class="muted">backoff timers</text><path d="M530,660 L530,770" class="ln engine dash" marker-end="url(#vkc-a-engine)"/><text x="520" y="712" font-size="13" text-anchor="end" class="muted">work</text><text x="520" y="730" font-size="13" text-anchor="end" class="muted">deltas</text><path d="M640,770 L640,660" class="ln engine" marker-end="url(#vkc-a-engine)"/><text x="650" y="712" font-size="13" text-anchor="start" class="muted">claims,</text><text x="650" y="730" font-size="13" text-anchor="start" class="muted">outcomes</text><rect x="440" y="960" width="290" height="96" rx="10" class="b ext"/><rect x="440" y="960" width="290" height="96" rx="10" class="tint-ext" stroke="none"/><text x="585.0" y="985" font-size="16" text-anchor="middle" class="ttl">Tools and backends</text><text x="585.0" y="1006.0" font-size="14" text-anchor="middle" class="muted">carrier API · order system</text><text x="585.0" y="1025.6" font-size="14" text-anchor="middle" class="muted">dedupe by key, reject stale fences</text><path d="M530,882 L530,960" class="ln ext" marker-end="url(#vkc-a-ext)"/><text x="522" y="926" font-size="13" text-anchor="end" class="muted">Create · Cancel · lookup</text><path d="M640,960 L640,882" class="ln ext" marker-end="url(#vkc-a-ext)"/><text x="648" y="926" font-size="13" text-anchor="start" class="muted">events</text><text x="24" y="1104" font-size="13" text-anchor="start" class="muted ttl">Components</text><rect x="24" y="1117" width="15" height="15" rx="3" class="b model"/><rect x="24" y="1117" width="15" height="15" rx="3" class="tint-model" stroke="none"/><text x="45" y="1129" font-size="13" text-anchor="start" class="muted">model</text><rect x="105.4" y="1117" width="15" height="15" rx="3" class="b engine"/><rect x="105.4" y="1117" width="15" height="15" rx="3" class="tint-engine" stroke="none"/><text x="126.4" y="1129" font-size="13" text-anchor="start" class="muted">InputLayer</text><rect x="223.20000000000002" y="1117" width="15" height="15" rx="3" class="b app"/><text x="244.20000000000002" y="1129" font-size="13" text-anchor="start" class="muted">application</text><rect x="348.28000000000003" y="1117" width="15" height="15" rx="3" class="b ext"/><rect x="348.28000000000003" y="1117" width="15" height="15" rx="3" class="tint-ext" stroke="none"/><text x="369.28000000000003" y="1129" font-size="13" text-anchor="start" class="muted">external</text><rect x="451.52000000000004" y="1117" width="15" height="15" rx="3" class="b ctl"/><rect x="451.52000000000004" y="1117" width="15" height="15" rx="3" class="tint-ctl" stroke="none"/><text x="472.52000000000004" y="1129" font-size="13" text-anchor="start" class="muted">control</text><rect x="24" y="1150" width="6" height="15" rx="3" class="m-model"/><text x="38" y="1162" font-size="13" text-anchor="start" class="muted">a model hosted inside an application stage</text><text x="24" y="1196" font-size="13" text-anchor="start" class="muted ttl">Edges</text><path d="M24,1216 L54,1216" class="ln muted" marker-end="url(#vkc-a-muted)"/><text x="62" y="1221" font-size="13" text-anchor="start" class="muted">data lane</text><path d="M151.52,1216 L181.52,1216" class="ln ctl" marker-end="url(#vkc-a-ctl)"/><text x="189.52" y="1221" font-size="13" text-anchor="start" class="muted">system lane</text><path d="M293.6,1216 L323.6,1216" class="ln engine dash" marker-end="url(#vkc-a-engine)"/><text x="331.6" y="1221" font-size="13" text-anchor="start" class="muted">engine delta</text><path d="M442.96000000000004,1216 L472.96000000000004,1216" class="ln engine" marker-end="url(#vkc-a-engine)"/><text x="480.96000000000004" y="1221" font-size="13" text-anchor="start" class="muted">engine program</text><path d="M606.8800000000001,1216 L636.8800000000001,1216" class="ln ext" marker-end="url(#vkc-a-ext)"/><text x="644.8800000000001" y="1221" font-size="13" text-anchor="start" class="muted">external call</text></svg>
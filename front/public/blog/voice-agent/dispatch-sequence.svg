<svg xmlns="http://www.w3.org/2000/svg" class="vkd" viewBox="0 0 760 1420" width="100%" role="img" aria-labelledby="vkd-t vkd-d" preserveAspectRatio="xMidYMid meet"><title id="vkd-t">Multitasking dispatch: one work item, end to end</title><desc id="vkd-d">Sequence of one work item across the engine, the owning executor, a successor executor and the carrier API: a guarded claim program, Create with an idempotency key and fence, Accepted, then either a cancel branch or a completion branch, each ending in a guarded terminal program, and finally a lease takeover with reconciliation by key.</desc>
<style>
  .vkd { --fb-fg:#e9ecf3; --fb-muted:#a3abbc; --fb-line:#3a4050; --fb-card:#1b1e26; --fb-engine:#3fc8db; --fb-model:#a797ff; --fb-app:#b3bbcc; --fb-ext:#e3ac4f; --fb-ctl:#ff7f5e; --fb-ok:#62d48f; }
  @media (prefers-color-scheme: light) { .vkd { --fb-fg:#1a1d26; --fb-muted:#5c6475; --fb-line:#cfd4df; --fb-card:#f7f8fb; --fb-engine:#0b8fa3; --fb-model:#5d49e0; --fb-app:#5a6479; --fb-ext:#a86d12; --fb-ctl:#cf4a30; --fb-ok:#23924f; } }
  .vkd text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--foreground, var(--fb-fg)); }
  .vkd .muted { fill: var(--muted-foreground, var(--fb-muted)); }
  .vkd .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .vkd .ttl { font-weight: 600; }
  .vkd .b { fill: var(--card, var(--fb-card)); stroke: var(--border, var(--fb-line)); stroke-width: 1.6; }
  .vkd .engine { stroke: var(--primary, var(--fb-engine)); }
  .vkd .model { stroke: var(--accent, var(--fb-model)); }
  .vkd .app { stroke: var(--muted-foreground, var(--fb-app)); }
  .vkd .ext { stroke: var(--warning, var(--fb-ext)); }
  .vkd .ctl { stroke: var(--destructive, var(--fb-ctl)); }
  .vkd .ok { stroke: var(--success, var(--fb-ok)); }
  .vkd .tint-engine { fill: var(--primary, var(--fb-engine)); fill-opacity: .13; }
  .vkd .tint-model { fill: var(--accent, var(--fb-model)); fill-opacity: .13; }
  .vkd .tint-ext { fill: var(--warning, var(--fb-ext)); fill-opacity: .13; }
  .vkd .tint-ctl { fill: var(--destructive, var(--fb-ctl)); fill-opacity: .12; }
  .vkd .tint-ok { fill: var(--success, var(--fb-ok)); fill-opacity: .12; }
  .vkd .lane { fill: none; stroke: var(--border, var(--fb-line)); stroke-width: 1.2; stroke-dasharray: 6 5; }
  .vkd .ln { fill: none; stroke: var(--muted-foreground, var(--fb-muted)); stroke-width: 2; }
  .vkd .ln.engine { stroke: var(--primary, var(--fb-engine)); } .vkd .ln.ctl { stroke: var(--destructive, var(--fb-ctl)); } .vkd .ln.ok { stroke: var(--success, var(--fb-ok)); } .vkd .ln.ext { stroke: var(--warning, var(--fb-ext)); } .vkd .ln.model { stroke: var(--accent, var(--fb-model)); }
  .vkd .dash { stroke-dasharray: 7 5; }
  .vkd .axis { stroke: var(--border, var(--fb-line)); stroke-width: 2; }
  .vkd .m-muted { fill: var(--muted-foreground, var(--fb-muted)); } .vkd .m-engine { fill: var(--primary, var(--fb-engine)); } .vkd .m-ctl { fill: var(--destructive, var(--fb-ctl)); } .vkd .m-ok { fill: var(--success, var(--fb-ok)); } .vkd .m-ext { fill: var(--warning, var(--fb-ext)); } .vkd .m-model { fill: var(--accent, var(--fb-model)); }
</style>
<defs><marker id="vkd-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="vkd-a-engine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-engine"/></marker><marker id="vkd-a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-ctl"/></marker><marker id="vkd-a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-ok"/></marker><marker id="vkd-a-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-model"/></marker><marker id="vkd-a-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-ext"/></marker></defs><text x="24" y="38" font-size="22" text-anchor="start" class="ttl">Multitasking dispatch: one work item, end to end</text><text x="24" y="62" font-size="14" text-anchor="start" class="muted">Every decision is a guarded program; the two branches are alternatives, not a sequence.</text><rect x="25.0" y="96" width="150" height="42" rx="10" class="b engine"/><rect x="25.0" y="96" width="150" height="42" rx="10" class="tint-engine" stroke="none"/><text x="100.0" y="122.4" font-size="15" text-anchor="middle" class="ttl">InputLayer</text><line x1="100" y1="138" x2="100" y2="1360" class="axis"/><rect x="255.0" y="96" width="150" height="42" rx="10" class="b app"/><text x="330.0" y="122.4" font-size="15" text-anchor="middle" class="ttl">exec-1 · epoch 4</text><line x1="330" y1="138" x2="330" y2="1360" class="axis"/><rect x="455.0" y="96" width="130" height="42" rx="10" class="b app"/><text x="520.0" y="122.4" font-size="15" text-anchor="middle" class="ttl">exec-2 · epoch 5</text><line x1="520" y1="138" x2="520" y2="1360" class="axis"/><rect x="620.0" y="96" width="120" height="42" rx="10" class="b ext"/><rect x="620.0" y="96" width="120" height="42" rx="10" class="tint-ext" stroke="none"/><text x="680.0" y="122.4" font-size="15" text-anchor="middle" class="ttl">Carrier API</text><line x1="680" y1="138" x2="680" y2="1360" class="axis"/><path d="M100,180 L330,180" class="ln engine dash" marker-end="url(#vkd-a-engine)"/><text x="215.0" y="172" font-size="13" text-anchor="middle" class="">delta: work start (eligible)</text><text x="215.0" y="196" font-size="13" text-anchor="middle" class="muted mono">work seq=1</text><rect x="185.0" y="198" width="290" height="108" rx="10" class="b app"/><text x="330.0" y="223" font-size="14" text-anchor="middle" class="ttl">claim program (guarded)</text><text x="330.0" y="244.0" font-size="13" text-anchor="middle" class="muted">.require eligible ∧ lease_owner(me, 4)</text><text x="330.0" y="262.2" font-size="13" text-anchor="middle" class="muted">∧ lease_until unexpired by time_now()</text><text x="330.0" y="280.4" font-size="13" text-anchor="middle" class="muted">∧ no attempt with ordinal 1</text><text x="330.0" y="298.6" font-size="13" text-anchor="middle" class="muted">+attempt(att-9f3, epoch 4, ordinal 1)</text><path d="M330,330 L100,330" class="ln engine" marker-end="url(#vkd-a-engine)"/><text x="215.0" y="322" font-size="13" text-anchor="middle" class="">commit → start row leaves; run_ok(att-9f3)</text><text x="215.0" y="346" font-size="13" text-anchor="middle" class="muted mono">work seq=2</text><path d="M330,378 L680,378" class="ln ext" marker-end="url(#vkd-a-ext)"/><text x="505.0" y="370" font-size="13" text-anchor="middle" class="">Create(task, key = h(item, ordinal 1), fence = epoch 4)</text><path d="M680,422 L330,422" class="ln ok" marker-end="url(#vkd-a-ok)"/><text x="505.0" y="414" font-size="13" text-anchor="middle" class="">Accepted(task T) → +attempt_task</text><rect x="40" y="452" width="700" height="220" rx="10" class="lane"/><text x="52" y="470" font-size="13" text-anchor="start" class="muted ttl">alt · cancel: kill switch, goal retracted, policy disabled</text><path d="M100,502 L330,502" class="ln ctl dash" marker-end="url(#vkd-a-ctl)"/><text x="215.0" y="494" font-size="13" text-anchor="middle" class="">delta: cancel att-9f3 (run_ok withdrawn)</text><text x="215.0" y="518" font-size="13" text-anchor="middle" class="muted mono">work seq=3</text><path d="M330,546 L680,546" class="ln ctl" marker-end="url(#vkd-a-ctl)"/><text x="505.0" y="538" font-size="13" text-anchor="middle" class="">Cancel(T, reason)</text><path d="M680,588 L330,588" class="ln ctl" marker-end="url(#vkd-a-ctl)"/><text x="505.0" y="580" font-size="13" text-anchor="middle" class="">Cancelled(T) — or a Completion that raced it</text><rect x="185.0" y="602" width="290" height="72" rx="10" class="b app"/><text x="330.0" y="627" font-size="14" text-anchor="middle" class="ttl">terminal program (guarded, first wins)</text><text x="330.0" y="648.0" font-size="13" text-anchor="middle" class="muted">.require attempt(…, Id, …), !attempt_done(Id, …)</text><text x="330.0" y="666.2" font-size="13" text-anchor="middle" class="muted">+attempt_done(att-9f3, cancelled | ok, …)</text><rect x="40" y="692" width="700" height="238" rx="10" class="lane"/><text x="52" y="710" font-size="13" text-anchor="start" class="muted ttl">alt · completion: the normal path</text><path d="M680,742 L330,742" class="ln ok" marker-end="url(#vkd-a-ok)"/><text x="505.0" y="734" font-size="13" text-anchor="middle" class="">Completion(result)</text><rect x="185.0" y="758" width="290" height="108" rx="10" class="b app"/><text x="330.0" y="783" font-size="14" text-anchor="middle" class="ttl">observation program (guarded)</text><text x="330.0" y="804.0" font-size="13" text-anchor="middle" class="muted">.require attempt open ∧ no note observed</text><text x="330.0" y="822.2" font-size="13" text-anchor="middle" class="muted">after this result (latest_note_at)</text><text x="330.0" y="840.4" font-size="13" text-anchor="middle" class="muted">replace carrier_note(S-77, …, observed)</text><text x="330.0" y="858.6" font-size="13" text-anchor="middle" class="muted">+attempt_done(att-9f3, ok)</text><path d="M330,890 L100,890" class="ln engine" marker-end="url(#vkd-a-engine)"/><text x="215.0" y="882" font-size="13" text-anchor="middle" class="">commit → work_intent leaves; speech: carrier_reason</text><text x="215.0" y="906" font-size="13" text-anchor="middle" class="muted mono">one revision</text><rect x="40" y="950" width="700" height="340" rx="10" class="lane"/><text x="52" y="968" font-size="13" text-anchor="start" class="muted ttl">handover · exec-1 lease expires</text><rect x="385.0" y="966" width="270" height="108" rx="10" class="b app"/><text x="520.0" y="991" font-size="14" text-anchor="middle" class="ttl">takeover program</text><text x="520.0" y="1012.0" font-size="13" text-anchor="middle" class="muted">one compare-and-set over both relations:</text><text x="520.0" y="1030.2" font-size="13" text-anchor="middle" class="muted">lease_until expired by time_now() and</text><text x="520.0" y="1048.4" font-size="13" text-anchor="middle" class="muted">lease_owner epoch 4 → 5; a second</text><text x="520.0" y="1066.6" font-size="13" text-anchor="middle" class="muted">taker matches nothing</text><path d="M100,1096 L520,1096" class="ln engine dash" marker-end="url(#vkd-a-engine)"/><text x="310.0" y="1088" font-size="13" text-anchor="middle" class="">delta: reconcile open attempts of epoch 4</text><text x="310.0" y="1112" font-size="13" text-anchor="middle" class="muted mono">work (exec-2)</text><path d="M520,1142 L680,1142" class="ln ext" marker-end="url(#vkd-a-ext)"/><text x="600.0" y="1134" font-size="13" text-anchor="middle" class="">lookup by key h(item, ordinal 1)</text><path d="M680,1184 L520,1184" class="ln ok" marker-end="url(#vkd-a-ok)"/><text x="600.0" y="1176" font-size="13" text-anchor="middle" class="">status of T → adopt or finalize</text><rect x="395.0" y="1198" width="250" height="72" rx="10" class="b app"/><text x="520.0" y="1223" font-size="14" text-anchor="middle" class="ttl">reconcile before any new ordinal</text><text x="520.0" y="1244.0" font-size="13" text-anchor="middle" class="muted">adopt: guarded reassignment of attempt</text><text x="520.0" y="1262.2" font-size="13" text-anchor="middle" class="muted">finalize: guarded terminal program</text><text x="380" y="1316" font-size="13" text-anchor="middle" class="muted">The backend deduplicates by key and rejects fences older than the latest it has seen.</text><text x="380" y="1338" font-size="13" text-anchor="middle" class="muted">Exactly-once effects come from the key at the effect; the engine gives atomic, serialized records.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" class="vko" viewBox="0 0 720 760" width="100%" role="img" aria-labelledby="vko-t vko-d" preserveAspectRatio="xMidYMid meet"><title id="vko-t">The fact, rule and subscription loop</title><desc id="vko-d">Programs write facts atomically at one revision; rules derive the current claims, speech and work rows; standing queries push inserted and retracted rows; consumers act and write receipts and outcomes back as facts.</desc>
<style>
  .vko { --fb-fg:#e9ecf3; --fb-muted:#a3abbc; --fb-line:#3a4050; --fb-card:#1b1e26; --fb-engine:#3fc8db; --fb-model:#a797ff; --fb-app:#b3bbcc; --fb-ext:#e3ac4f; --fb-ctl:#ff7f5e; --fb-ok:#62d48f; }
  @media (prefers-color-scheme: light) { .vko { --fb-fg:#1a1d26; --fb-muted:#5c6475; --fb-line:#cfd4df; --fb-card:#f7f8fb; --fb-engine:#0b8fa3; --fb-model:#5d49e0; --fb-app:#5a6479; --fb-ext:#a86d12; --fb-ctl:#cf4a30; --fb-ok:#23924f; } }
  .vko text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--foreground, var(--fb-fg)); }
  .vko .muted { fill: var(--muted-foreground, var(--fb-muted)); }
  .vko .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .vko .ttl { font-weight: 600; }
  .vko .b { fill: var(--card, var(--fb-card)); stroke: var(--border, var(--fb-line)); stroke-width: 1.6; }
  .vko .engine { stroke: var(--primary, var(--fb-engine)); }
  .vko .model { stroke: var(--accent, var(--fb-model)); }
  .vko .app { stroke: var(--muted-foreground, var(--fb-app)); }
  .vko .ext { stroke: var(--warning, var(--fb-ext)); }
  .vko .ctl { stroke: var(--destructive, var(--fb-ctl)); }
  .vko .ok { stroke: var(--success, var(--fb-ok)); }
  .vko .tint-engine { fill: var(--primary, var(--fb-engine)); fill-opacity: .13; }
  .vko .tint-model { fill: var(--accent, var(--fb-model)); fill-opacity: .13; }
  .vko .tint-ext { fill: var(--warning, var(--fb-ext)); fill-opacity: .13; }
  .vko .tint-ctl { fill: var(--destructive, var(--fb-ctl)); fill-opacity: .12; }
  .vko .tint-ok { fill: var(--success, var(--fb-ok)); fill-opacity: .12; }
  .vko .lane { fill: none; stroke: var(--border, var(--fb-line)); stroke-width: 1.2; stroke-dasharray: 6 5; }
  .vko .ln { fill: none; stroke: var(--muted-foreground, var(--fb-muted)); stroke-width: 2; }
  .vko .ln.engine { stroke: var(--primary, var(--fb-engine)); } .vko .ln.ctl { stroke: var(--destructive, var(--fb-ctl)); } .vko .ln.ok { stroke: var(--success, var(--fb-ok)); } .vko .ln.ext { stroke: var(--warning, var(--fb-ext)); } .vko .ln.model { stroke: var(--accent, var(--fb-model)); }
  .vko .dash { stroke-dasharray: 7 5; }
  .vko .axis { stroke: var(--border, var(--fb-line)); stroke-width: 2; }
  .vko .m-muted { fill: var(--muted-foreground, var(--fb-muted)); } .vko .m-engine { fill: var(--primary, var(--fb-engine)); } .vko .m-ctl { fill: var(--destructive, var(--fb-ctl)); } .vko .m-ok { fill: var(--success, var(--fb-ok)); } .vko .m-ext { fill: var(--warning, var(--fb-ext)); } .vko .m-model { fill: var(--accent, var(--fb-model)); }
</style>
<defs><marker id="vko-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="vko-a-engine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-engine"/></marker><marker id="vko-a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-ctl"/></marker><marker id="vko-a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-ok"/></marker><marker id="vko-a-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-model"/></marker><marker id="vko-a-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-ext"/></marker></defs><text x="24" y="38" font-size="22" text-anchor="start" class="ttl">The fact → rule → subscription loop</text><text x="24" y="62" font-size="14" text-anchor="start" class="muted">Everything a consumer does comes back as a fact; nothing is coordinated by messages.</text><rect x="250" y="340" width="220" height="150" rx="10" class="b engine"/><rect x="250" y="340" width="220" height="150" rx="10" class="tint-engine" stroke="none"/><text x="360.0" y="365" font-size="18" text-anchor="middle" class="ttl">InputLayer</text><text x="360.0" y="386.0" font-size="14" text-anchor="middle" class="muted">one knowledge graph</text><text x="360.0" y="405.6" font-size="14" text-anchor="middle" class="muted">per tenant</text><text x="360.0" y="425.2" font-size="14" text-anchor="middle" class="muted">a revision per change</text><rect x="40" y="110" width="300" height="136" rx="10" class="b app"/><text x="190.0" y="135" font-size="17" text-anchor="middle" class="ttl">1 · Write a program</text><text x="190.0" y="156.0" font-size="13" text-anchor="middle" class="muted">adapter · gate · pump · executor</text><text x="190.0" y="174.2" font-size="13" text-anchor="middle" class="muted">guarded, atomic, one revision</text><text x="190.0" y="192.4" font-size="13" text-anchor="middle" class="muted">.require makes it compare-and-set</text><rect x="380" y="110" width="300" height="136" rx="10" class="b engine"/><rect x="380" y="110" width="300" height="136" rx="10" class="tint-engine" stroke="none"/><text x="530.0" y="135" font-size="17" text-anchor="middle" class="ttl">2 · Rules derive</text><text x="530.0" y="156.0" font-size="13" text-anchor="middle" class="muted">claim · speech · work · eligible</text><text x="530.0" y="174.2" font-size="13" text-anchor="middle" class="muted">stratified negation and aggregates</text><text x="530.0" y="192.4" font-size="13" text-anchor="middle" class="muted">withdraw what no longer holds</text><rect x="380" y="580" width="300" height="136" rx="10" class="b engine"/><rect x="380" y="580" width="300" height="136" rx="10" class="tint-engine" stroke="none"/><text x="530.0" y="605" font-size="17" text-anchor="middle" class="ttl">3 · Standing queries push</text><text x="530.0" y="626.0" font-size="13" text-anchor="middle" class="muted">snapshot at a revision, then</text><text x="530.0" y="644.2" font-size="13" text-anchor="middle" class="muted">inserted / retracted per push</text><text x="530.0" y="662.4" font-size="13" text-anchor="middle" class="muted">seq without gaps, coalesced</text><rect x="40" y="580" width="300" height="136" rx="10" class="b app"/><text x="190.0" y="605" font-size="17" text-anchor="middle" class="ttl">4 · Consumers act</text><text x="190.0" y="626.0" font-size="13" text-anchor="middle" class="muted">agenda speaks · executor runs tools</text><text x="190.0" y="644.2" font-size="13" text-anchor="middle" class="muted">receipts and outcomes are facts,</text><text x="190.0" y="662.4" font-size="13" text-anchor="middle" class="muted">committed with their own guards</text><path d="M340,178 L380,178" class="ln engine" marker-end="url(#vko-a-engine)"/><path d="M530,246 L530,580" class="ln engine" marker-end="url(#vko-a-engine)"/><text x="542" y="408" font-size="13" text-anchor="start" class="muted">dependency-filtered</text><text x="542" y="426" font-size="13" text-anchor="start" class="muted">re-evaluation</text><path d="M380,648 L340,648" class="ln muted" marker-end="url(#vko-a-muted)"/><path d="M190,580 L190,246" class="ln muted" marker-end="url(#vko-a-muted)"/><text x="178" y="408" font-size="13" text-anchor="end" class="muted">facts: playback,</text><text x="178" y="426" font-size="13" text-anchor="end" class="muted">attempt, consent</text><path d="M250,415 L200,415" class="ln engine dash" marker-end="url(#vko-a-engine)"/><path d="M470,415 L520,415" class="ln engine dash" marker-end="url(#vko-a-engine)"/><text x="360" y="745" font-size="13" text-anchor="middle" class="muted">.why at the decision snapshot: the proof travels with the record</text></svg>
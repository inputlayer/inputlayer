<svg xmlns="http://www.w3.org/2000/svg" class="vkl" viewBox="0 0 760 720" width="100%" role="img" aria-labelledby="vkl-t vkl-d" preserveAspectRatio="xMidYMid meet"><title id="vkl-t">Data flow and control flow in the runtime</title><desc id="vkl-d">Between stages, a priority system lane carries Start, Stop and Interrupt downstream and Error upstream; a FIFO data lane carries audio, transcripts, voice edges and claim markers downstream. Sequence stamps make the interrupt flush causal. Active stages also poll an engine channel that is never flushed.</desc>
<style>
  .vkl { --fb-fg:#e9ecf3; --fb-muted:#a3abbc; --fb-line:#3a4050; --fb-card:#1b1e26; --fb-engine:#3fc8db; --fb-model:#a797ff; --fb-app:#b3bbcc; --fb-ext:#e3ac4f; --fb-ctl:#ff7f5e; --fb-ok:#62d48f; }
  @media (prefers-color-scheme: light) { .vkl { --fb-fg:#1a1d26; --fb-muted:#5c6475; --fb-line:#cfd4df; --fb-card:#f7f8fb; --fb-engine:#0b8fa3; --fb-model:#5d49e0; --fb-app:#5a6479; --fb-ext:#a86d12; --fb-ctl:#cf4a30; --fb-ok:#23924f; } }
  .vkl text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--foreground, var(--fb-fg)); }
  .vkl .muted { fill: var(--muted-foreground, var(--fb-muted)); }
  .vkl .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .vkl .ttl { font-weight: 600; }
  .vkl .b { fill: var(--card, var(--fb-card)); stroke: var(--border, var(--fb-line)); stroke-width: 1.6; }
  .vkl .engine { stroke: var(--primary, var(--fb-engine)); }
  .vkl .model { stroke: var(--accent, var(--fb-model)); }
  .vkl .app { stroke: var(--muted-foreground, var(--fb-app)); }
  .vkl .ext { stroke: var(--warning, var(--fb-ext)); }
  .vkl .ctl { stroke: var(--destructive, var(--fb-ctl)); }
  .vkl .ok { stroke: var(--success, var(--fb-ok)); }
  .vkl .tint-engine { fill: var(--primary, var(--fb-engine)); fill-opacity: .13; }
  .vkl .tint-model { fill: var(--accent, var(--fb-model)); fill-opacity: .13; }
  .vkl .tint-ext { fill: var(--warning, var(--fb-ext)); fill-opacity: .13; }
  .vkl .tint-ctl { fill: var(--destructive, var(--fb-ctl)); fill-opacity: .12; }
  .vkl .tint-ok { fill: var(--success, var(--fb-ok)); fill-opacity: .12; }
  .vkl .lane { fill: none; stroke: var(--border, var(--fb-line)); stroke-width: 1.2; stroke-dasharray: 6 5; }
  .vkl .ln { fill: none; stroke: var(--muted-foreground, var(--fb-muted)); stroke-width: 2; }
  .vkl .ln.engine { stroke: var(--primary, var(--fb-engine)); } .vkl .ln.ctl { stroke: var(--destructive, var(--fb-ctl)); } .vkl .ln.ok { stroke: var(--success, var(--fb-ok)); } .vkl .ln.ext { stroke: var(--warning, var(--fb-ext)); } .vkl .ln.model { stroke: var(--accent, var(--fb-model)); }
  .vkl .dash { stroke-dasharray: 7 5; }
  .vkl .axis { stroke: var(--border, var(--fb-line)); stroke-width: 2; }
  .vkl .m-muted { fill: var(--muted-foreground, var(--fb-muted)); } .vkl .m-engine { fill: var(--primary, var(--fb-engine)); } .vkl .m-ctl { fill: var(--destructive, var(--fb-ctl)); } .vkl .m-ok { fill: var(--success, var(--fb-ok)); } .vkl .m-ext { fill: var(--warning, var(--fb-ext)); } .vkl .m-model { fill: var(--accent, var(--fb-model)); }
</style>
<defs><marker id="vkl-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="vkl-a-engine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-engine"/></marker><marker id="vkl-a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-ctl"/></marker><marker id="vkl-a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-ok"/></marker><marker id="vkl-a-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-model"/></marker><marker id="vkl-a-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-ext"/></marker></defs><text x="24" y="38" font-size="22" text-anchor="start" class="ttl">Data flow and control flow in the runtime</text><text x="24" y="62" font-size="14" text-anchor="start" class="muted">Two lanes between every pair of stages, plus one engine channel that is not a lane.</text><rect x="40" y="170" width="190" height="180" rx="10" class="b app"/><text x="135.0" y="195" font-size="17" text-anchor="middle" class="ttl">Stage A</text><text x="135.0" y="216.0" font-size="13" text-anchor="middle" class="muted">decide: sync, owns state</text><text x="135.0" y="234.2" font-size="13" text-anchor="middle" class="muted">perform: async,</text><text x="135.0" y="252.4" font-size="13" text-anchor="middle" class="muted">cancellable</text><rect x="285" y="170" width="190" height="180" rx="10" class="b app"/><text x="380.0" y="195" font-size="17" text-anchor="middle" class="ttl">Stage B</text><text x="380.0" y="216.0" font-size="13" text-anchor="middle" class="muted">decide: sync, owns state</text><text x="380.0" y="234.2" font-size="13" text-anchor="middle" class="muted">perform: async,</text><text x="380.0" y="252.4" font-size="13" text-anchor="middle" class="muted">cancellable</text><rect x="530" y="170" width="190" height="180" rx="10" class="b app"/><text x="625.0" y="195" font-size="17" text-anchor="middle" class="ttl">Tail pump</text><text x="625.0" y="216.0" font-size="13" text-anchor="middle" class="muted">owns the device;</text><text x="625.0" y="234.2" font-size="13" text-anchor="middle" class="muted">races the system lane</text><text x="625.0" y="252.4" font-size="13" text-anchor="middle" class="muted">while pushing</text><path d="M230,205 L285,205" class="ln ctl" marker-end="url(#vkl-a-ctl)"/><path d="M475,205 L530,205" class="ln ctl" marker-end="url(#vkl-a-ctl)"/><path d="M285,235 L230,235" class="ln ctl" marker-end="url(#vkl-a-ctl)"/><path d="M530,235 L475,235" class="ln ctl" marker-end="url(#vkl-a-ctl)"/><text x="252" y="128" font-size="14" text-anchor="middle" class="ttl">system lane · drained first</text><text x="252" y="148" font-size="13" text-anchor="middle" class="muted mono">↓ Start · Stop · Interrupt    ↑ Error</text><text x="600" y="128" font-size="14" text-anchor="middle" class="ttl">hops the queue</text><text x="600" y="148" font-size="13" text-anchor="middle" class="muted">Interrupt drops the in-flight perform</text><path d="M230,310 L285,310" class="ln muted" marker-end="url(#vkl-a-muted)"/><path d="M475,310 L530,310" class="ln muted" marker-end="url(#vkl-a-muted)"/><text x="252" y="378" font-size="14" text-anchor="middle" class="ttl">data lane · FIFO, downstream only</text><text x="252" y="398" font-size="13" text-anchor="middle" class="muted">audio · transcripts · voice edges · claim markers</text><text x="600" y="378" font-size="14" text-anchor="middle" class="ttl">sequence stamps order frames</text><text x="600" y="398" font-size="13" text-anchor="middle" class="muted">across both lanes of a link</text><rect x="40" y="430" width="680" height="128" rx="10" class="b ctl"/><rect x="40" y="430" width="680" height="128" rx="10" class="tint-ctl" stroke="none"/><text x="380.0" y="455" font-size="17" text-anchor="middle" class="ttl">Causal flush on Interrupt</text><text x="380.0" y="476.0" font-size="13" text-anchor="middle" class="muted">dropped: data frames stamped before the Interrupt that do not survive a flush:</text><text x="380.0" y="494.2" font-size="13" text-anchor="middle" class="muted">audio, generated transcripts, voice edges, claim markers</text><text x="380.0" y="512.4" font-size="13" text-anchor="middle" class="muted">kept: frames stamped after it (the barge-in utterance) and durable frames:</text><text x="380.0" y="530.6" font-size="13" text-anchor="middle" class="muted">Model(Input), ToolCall, every Dispatch frame</text><rect x="40" y="586" width="680" height="100" rx="10" class="b engine"/><rect x="40" y="586" width="680" height="100" rx="10" class="tint-engine" stroke="none"/><text x="380.0" y="611" font-size="17" text-anchor="middle" class="ttl">Engine channel (active stages only)</text><text x="380.0" y="632.0" font-size="13" text-anchor="middle" class="muted">subscription deltas in, programs out · polled fairly with the data lane, after the system lane</text><text x="380.0" y="650.2" font-size="13" text-anchor="middle" class="muted">never flushed by an Interrupt, never a lane between stages</text><path d="M380,430 L380,352" class="ln engine dash" marker-end="url(#vkl-a-engine)"/></svg>
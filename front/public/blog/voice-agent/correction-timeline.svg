<svg xmlns="http://www.w3.org/2000/svg" class="vkt" viewBox="0 0 760 1330" width="100%" role="img" aria-labelledby="vkt-t vkt-d" preserveAspectRatio="xMidYMid meet"><title id="vkt-t">A fact changes mid-utterance</title><desc id="vkt-d">Timeline of a correction. Left: the engine commits and the speech rows they change, including the playback reservations. Right: what the speech loop does. The carrier revision lands while the first ETA is playing; the pump marks it superseded, the rules derive a correction, and the agenda speaks it when the floor is free.</desc>
<style>
  .vkt { --fb-fg:#e9ecf3; --fb-muted:#a3abbc; --fb-line:#3a4050; --fb-card:#1b1e26; --fb-engine:#3fc8db; --fb-model:#a797ff; --fb-app:#b3bbcc; --fb-ext:#e3ac4f; --fb-ctl:#ff7f5e; --fb-ok:#62d48f; }
  @media (prefers-color-scheme: light) { .vkt { --fb-fg:#1a1d26; --fb-muted:#5c6475; --fb-line:#cfd4df; --fb-card:#f7f8fb; --fb-engine:#0b8fa3; --fb-model:#5d49e0; --fb-app:#5a6479; --fb-ext:#a86d12; --fb-ctl:#cf4a30; --fb-ok:#23924f; } }
  .vkt text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--foreground, var(--fb-fg)); }
  .vkt .muted { fill: var(--muted-foreground, var(--fb-muted)); }
  .vkt .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .vkt .ttl { font-weight: 600; }
  .vkt .b { fill: var(--card, var(--fb-card)); stroke: var(--border, var(--fb-line)); stroke-width: 1.6; }
  .vkt .engine { stroke: var(--primary, var(--fb-engine)); }
  .vkt .model { stroke: var(--accent, var(--fb-model)); }
  .vkt .app { stroke: var(--muted-foreground, var(--fb-app)); }
  .vkt .ext { stroke: var(--warning, var(--fb-ext)); }
  .vkt .ctl { stroke: var(--destructive, var(--fb-ctl)); }
  .vkt .ok { stroke: var(--success, var(--fb-ok)); }
  .vkt .tint-engine { fill: var(--primary, var(--fb-engine)); fill-opacity: .13; }
  .vkt .tint-model { fill: var(--accent, var(--fb-model)); fill-opacity: .13; }
  .vkt .tint-ext { fill: var(--warning, var(--fb-ext)); fill-opacity: .13; }
  .vkt .tint-ctl { fill: var(--destructive, var(--fb-ctl)); fill-opacity: .12; }
  .vkt .tint-ok { fill: var(--success, var(--fb-ok)); fill-opacity: .12; }
  .vkt .lane { fill: none; stroke: var(--border, var(--fb-line)); stroke-width: 1.2; stroke-dasharray: 6 5; }
  .vkt .ln { fill: none; stroke: var(--muted-foreground, var(--fb-muted)); stroke-width: 2; }
  .vkt .ln.engine { stroke: var(--primary, var(--fb-engine)); } .vkt .ln.ctl { stroke: var(--destructive, var(--fb-ctl)); } .vkt .ln.ok { stroke: var(--success, var(--fb-ok)); } .vkt .ln.ext { stroke: var(--warning, var(--fb-ext)); } .vkt .ln.model { stroke: var(--accent, var(--fb-model)); }
  .vkt .dash { stroke-dasharray: 7 5; }
  .vkt .axis { stroke: var(--border, var(--fb-line)); stroke-width: 2; }
  .vkt .m-muted { fill: var(--muted-foreground, var(--fb-muted)); } .vkt .m-engine { fill: var(--primary, var(--fb-engine)); } .vkt .m-ctl { fill: var(--destructive, var(--fb-ctl)); } .vkt .m-ok { fill: var(--success, var(--fb-ok)); } .vkt .m-ext { fill: var(--warning, var(--fb-ext)); } .vkt .m-model { fill: var(--accent, var(--fb-model)); }
</style>
<defs><marker id="vkt-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="vkt-a-engine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-engine"/></marker><marker id="vkt-a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-ctl"/></marker><marker id="vkt-a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-ok"/></marker><marker id="vkt-a-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-model"/></marker><marker id="vkt-a-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-ext"/></marker></defs><text x="24" y="38" font-size="22" text-anchor="start" class="ttl">A fact changes mid-utterance</text><text x="24" y="62" font-size="14" text-anchor="start" class="muted">Left: engine commits and the speech rows they change. Right: what the speech loop does.</text><line x1="380" y1="96" x2="380" y2="1270" class="axis"/><text x="380" y="1296" font-size="13" text-anchor="middle" class="muted">time ↓</text><circle cx="380" cy="130" r="6" class="b engine"/><rect x="30" y="92" width="320" height="80" rx="10" class="b engine"/><rect x="30" y="92" width="320" height="80" rx="10" class="tint-engine" stroke="none"/><text x="190.0" y="117" font-size="15" text-anchor="middle" class="ttl">R1 · goal g-7 committed</text><text x="190.0" y="138.0" font-size="13" text-anchor="middle" class="muted">speech: state eta 10-08 · prio 2</text><text x="190.0" y="156.2" font-size="13" text-anchor="middle" class="muted">speech: supported eta 10-08</text><rect x="410" y="92" width="320" height="80" rx="10" class="b app"/><text x="570.0" y="117" font-size="15" text-anchor="middle" class="ttl">Agenda selects the state row</text><text x="570.0" y="138.0" font-size="13" text-anchor="middle" class="muted">commit check: supported row present</text><text x="570.0" y="156.2" font-size="13" text-anchor="middle" class="muted">realizes “It’s due Thursday, October 8th.”</text><circle cx="380" cy="250" r="6" class="b engine"/><rect x="30" y="212" width="320" height="99" rx="10" class="b engine"/><rect x="30" y="212" width="320" height="99" rx="10" class="tint-engine" stroke="none"/><text x="190.0" y="237" font-size="15" text-anchor="middle" class="ttl">R2 · playback pb-1 reserved</text><text x="190.0" y="258.0" font-size="13" text-anchor="middle" class="muted">guard: supported 10-08 still present,</text><text x="190.0" y="276.2" font-size="13" text-anchor="middle" class="muted">owner lease current, ordinal 1 free</text><text x="190.0" y="294.4" font-size="13" text-anchor="middle" class="muted">no speech row changes</text><rect x="410" y="212" width="320" height="80" rx="10" class="b app"/><text x="570.0" y="237" font-size="15" text-anchor="middle" class="ttl">Phrase handed to synthesis</text><text x="570.0" y="258.0" font-size="13" text-anchor="middle" class="muted">ClaimStart · transcript · ClaimEnd</text><text x="570.0" y="276.2" font-size="13" text-anchor="middle" class="muted">on the data lane</text><circle cx="380" cy="380" r="6" class="b engine"/><rect x="30" y="342" width="320" height="80" rx="10" class="b engine"/><rect x="30" y="342" width="320" height="80" rx="10" class="tint-engine" stroke="none"/><text x="190.0" y="367" font-size="15" text-anchor="middle" class="ttl">R3 · receipt: pb-1 playing</text><text x="190.0" y="388.0" font-size="13" text-anchor="middle" class="muted">state row leaves (heard)</text><text x="190.0" y="406.2" font-size="13" text-anchor="middle" class="muted">supported 10-08 stays</text><rect x="410" y="342" width="320" height="80" rx="10" class="b app"/><text x="570.0" y="367" font-size="15" text-anchor="middle" class="ttl">First chunk consumed by the device</text><text x="570.0" y="388.0" font-size="13" text-anchor="middle" class="muted">pump committed the receipt</text><text x="570.0" y="406.2" font-size="13" text-anchor="middle" class="muted">audio continues</text><circle cx="380" cy="500" r="6" class="b engine"/><rect x="30" y="462" width="320" height="118" rx="10" class="b engine"/><rect x="30" y="462" width="320" height="118" rx="10" class="tint-engine" stroke="none"/><text x="190.0" y="487" font-size="15" text-anchor="middle" class="ttl">R4 · carrier revision 1804</text><text x="190.0" y="508.0" font-size="13" text-anchor="middle" class="muted">supported 10-08 leaves</text><text x="190.0" y="526.2" font-size="13" text-anchor="middle" class="muted">supported 10-10 enters</text><text x="190.0" y="544.4" font-size="13" text-anchor="middle" class="muted">correction 10-10 · prio 1 enters</text><text x="190.0" y="562.6" font-size="13" text-anchor="middle" class="muted">work: start carrier_check</text><rect x="410" y="462" width="320" height="99" rx="10" class="b ctl"/><rect x="410" y="462" width="320" height="99" rx="10" class="tint-ctl" stroke="none"/><text x="570.0" y="487" font-size="15" text-anchor="middle" class="ttl">Same key, different value</text><text x="570.0" y="508.0" font-size="13" text-anchor="middle" class="muted">the agenda sends Interrupt downstream;</text><text x="570.0" y="526.2" font-size="13" text-anchor="middle" class="muted">the pump cancels the ring and</text><text x="570.0" y="544.4" font-size="13" text-anchor="middle" class="muted">commits pb-1 superseded</text><circle cx="380" cy="640" r="6" class="b engine"/><rect x="30" y="602" width="320" height="80" rx="10" class="b engine"/><rect x="30" y="602" width="320" height="80" rx="10" class="tint-engine" stroke="none"/><text x="190.0" y="627" font-size="15" text-anchor="middle" class="ttl">R5 · pb-1 superseded</text><text x="190.0" y="648.0" font-size="13" text-anchor="middle" class="muted">written by the pump; still audible,</text><text x="190.0" y="666.2" font-size="13" text-anchor="middle" class="muted">so heard = 10-08</text><rect x="410" y="602" width="320" height="80" rx="10" class="b app"/><text x="570.0" y="627" font-size="15" text-anchor="middle" class="ttl">Device buffer: the residual window</text><text x="570.0" y="648.0" font-size="13" text-anchor="middle" class="muted">audio already in the ring plays;</text><text x="570.0" y="666.2" font-size="13" text-anchor="middle" class="muted">no design recalls sound</text><circle cx="380" cy="760" r="6" class="b engine"/><rect x="30" y="722" width="320" height="80" rx="10" class="b engine"/><rect x="30" y="722" width="320" height="80" rx="10" class="tint-engine" stroke="none"/><text x="190.0" y="747" font-size="15" text-anchor="middle" class="ttl">R6 · playback pb-2 reserved</text><text x="190.0" y="768.0" font-size="13" text-anchor="middle" class="muted">guard: correction row present</text><text x="190.0" y="786.2" font-size="13" text-anchor="middle" class="muted">with value 10-10</text><rect x="410" y="722" width="320" height="80" rx="10" class="b app"/><text x="570.0" y="747" font-size="15" text-anchor="middle" class="ttl">Agenda reselects</text><text x="570.0" y="768.0" font-size="13" text-anchor="middle" class="muted">correction has priority 1;</text><text x="570.0" y="786.2" font-size="13" text-anchor="middle" class="muted">waits only for the floor</text><circle cx="380" cy="880" r="6" class="b engine"/><rect x="30" y="842" width="320" height="80" rx="10" class="b engine"/><rect x="30" y="842" width="320" height="80" rx="10" class="tint-engine" stroke="none"/><text x="190.0" y="867" font-size="15" text-anchor="middle" class="ttl">R7 · receipt: pb-2 playing</text><text x="190.0" y="888.0" font-size="13" text-anchor="middle" class="muted">correction row leaves</text><text x="190.0" y="906.2" font-size="13" text-anchor="middle" class="muted">supported 10-10 stays</text><rect x="410" y="842" width="320" height="80" rx="10" class="b app"/><text x="570.0" y="867" font-size="15" text-anchor="middle" class="ttl">Speaks the correction</text><text x="570.0" y="888.0" font-size="13" text-anchor="middle" class="muted">“Correction: it’s now due</text><text x="570.0" y="906.2" font-size="13" text-anchor="middle" class="muted">Saturday, October 10th.”</text><circle cx="380" cy="1000" r="6" class="b engine"/><rect x="30" y="962" width="320" height="80" rx="10" class="b engine"/><rect x="30" y="962" width="320" height="80" rx="10" class="tint-engine" stroke="none"/><text x="190.0" y="987" font-size="15" text-anchor="middle" class="ttl">R8 · receipt: pb-2 completed</text><text x="190.0" y="1008.0" font-size="13" text-anchor="middle" class="muted">nothing pending for this key</text><text x="190.0" y="1026.2" font-size="13" text-anchor="middle" class="muted">heard = 10-10</text><rect x="410" y="962" width="320" height="80" rx="10" class="b app"/><text x="570.0" y="987" font-size="15" text-anchor="middle" class="ttl">Quiet</text><text x="570.0" y="1008.0" font-size="13" text-anchor="middle" class="muted">a later change back to 10-08</text><text x="570.0" y="1026.2" font-size="13" text-anchor="middle" class="muted">would derive a new correction</text><rect x="30" y="1110" width="700" height="120" rx="10" class="b app"/><text x="380.0" y="1135" font-size="15" text-anchor="middle" class="ttl">If the user is speaking at R4</text><text x="380.0" y="1156.0" font-size="13" text-anchor="middle" class="muted">the agenda holds; the correction row stays in the view (level-triggered) and is selected when the floor is free.</text><text x="380.0" y="1174.2" font-size="13" text-anchor="middle" class="muted">A barge-in flushes queued audio and the pump marks pb-1 interrupted; interrupted counts as heard.</text><text x="380.0" y="1192.4" font-size="13" text-anchor="middle" class="muted">Only this claim key is touched; an unrelated revision changes no sentence.</text></svg>
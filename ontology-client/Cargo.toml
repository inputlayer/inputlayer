[package]
name = "inputlayer-ontology-client"
version = "0.1.0"
edition = "2021"
description = "Registry resolution and engine WebSocket client shared by il and the gateway"
license = "Elastic-2.0"
repository = "https://github.com/inputlayer/inputlayer"
rust-version = "1.88"

[dependencies]
anyhow = "1.0"
flate2 = "1.0"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.24"
toml = "0.8"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
missing_errors_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"

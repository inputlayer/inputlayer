services:
  inputlayer:
    image: ghcr.io/inputlayer/inputlayer:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - inputlayer-data:/var/lib/inputlayer/data
    environment:
      INPUTLAYER_ADMIN_PASSWORD: ${INPUTLAYER_ADMIN_PASSWORD:-}
      INPUTLAYER_BOOTSTRAP_API_KEY: ${INPUTLAYER_BOOTSTRAP_API_KEY:-}
      INPUTLAYER_HTTP__HOST: "0.0.0.0"
      INPUTLAYER_HTTP__PORT: "8080"
      INPUTLAYER_HTTP__CORS_ALLOW_ALL: "${CORS_ALLOW_ALL:-false}"
      INPUTLAYER_LOGGING__LEVEL: ${INPUTLAYER_LOG_LEVEL:-info}

  # The model gateway: OpenAI-compatible Verified Completions API on its own
  # port, its own configuration. Remove this service if you only want the
  # engine.
  gateway:
    image: ghcr.io/inputlayer/inputlayer-gateway:latest
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8081}:8081"
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8081"
      INPUTLAYER_URL: "http://inputlayer:8080"
      INPUTLAYER_API_KEY: ${INPUTLAYER_BOOTSTRAP_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Bearer token required on /v1/* when set; unset leaves the
      # gateway endpoints open (fine only behind a private network).
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      # Every ontology published in the registry index is loaded at startup
      # and pinned by version and digest; each request selects one via the
      # x-il-ontology header. INPUTLAYER_REGISTRY overrides the index location and
      # INPUTLAYER_REGISTRY_TOKEN is needed while the registry is private.
      INPUTLAYER_REGISTRY: ${INPUTLAYER_REGISTRY:-}
      INPUTLAYER_REGISTRY_TOKEN: ${INPUTLAYER_REGISTRY_TOKEN:-}
    volumes:
      # Persist the ontology cache so container recreation does not depend
      # on the registry being reachable.
      - gateway-cache:/var/lib/inputlayer
    depends_on:
      - inputlayer

volumes:
  inputlayer-data:
  gateway-cache:

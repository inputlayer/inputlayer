[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inputlayer-ingest-example"
version = "0.1.0"
description = "Ingestion recipe: Postgres CDC (Debezium) and webhooks to InputLayer facts"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4"]

[project.optional-dependencies]
demo = ["psycopg[binary]>=3.1,<4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8", "mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ingest"]

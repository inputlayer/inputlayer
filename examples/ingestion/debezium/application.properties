# Debezium Server: stream Postgres changes to the adapter's /cdc endpoint.
# Delivery is at-least-once: offsets are committed after the adapter answers
# 2xx, and a restart resends anything unacknowledged. The adapter makes those
# replays no-ops.

# Sink: one signed HTTP POST per change event (Standard Webhooks signature).
debezium.sink.type=http
debezium.sink.http.url=${CDC_SINK_URL}
debezium.sink.http.timeout.ms=30000
debezium.sink.http.retries=20
debezium.sink.http.retry.interval.ms=1000
debezium.sink.http.authentication.type=standard-webhooks
debezium.sink.http.authentication.webhook.secret=${CDC_WEBHOOK_SECRET}

# Plain JSON envelopes ({before, after, source, op}); no schema wrapper.
debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key=json
debezium.format.key.schemas.enable=false

# Source: Postgres logical replication through the built-in pgoutput plugin.
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput
debezium.source.database.hostname=${POSTGRES_HOST}
debezium.source.database.port=5432
debezium.source.database.user=${POSTGRES_USER}
debezium.source.database.password=${POSTGRES_PASSWORD}
debezium.source.database.dbname=${POSTGRES_DB}
debezium.source.topic.prefix=shop
debezium.source.table.include.list=public.customers
debezium.source.publication.autocreate.mode=filtered
debezium.source.slot.name=inputlayer_ingest
# Deletes are mapped from the "d" event; a Kafka-style null tombstone adds nothing.
debezium.source.tombstones.on.delete=false
# Poll the replication stream often: change-to-delta latency is the point.
debezium.source.poll.interval.ms=50
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0

quarkus.log.console.json=false

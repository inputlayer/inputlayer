# InputLayer Configuration Template
#
# Copy this file to config.toml or config.local.toml and customize.
#
# Environment variable overrides:
#   INPUTLAYER_STORAGE__DATA_DIR=/custom/path
#   INPUTLAYER_STORAGE__DEFAULT_KNOWLEDGE_GRAPH=mykg
#   INPUTLAYER_STORAGE__PERSISTENCE__FORMAT=csv

[storage]
# Base directory for all knowledge graph storage
# Production example: "/var/lib/inputlayer/data"
# Development example: "./data"
data_dir = "./data"

# Default knowledge graph (created on startup if missing)
default_knowledge_graph = "default"

# Automatically create knowledge graphs if they don't exist
# Set to true for development, false for production
auto_create_knowledge_graphs = false

# Knowledge graphs load into memory on first use. Most held at once
# (0 = no limit); past it, loading one unloads the least recently used idle ones.
max_loaded_knowledge_graphs = 0

# Unload a knowledge graph unused for this many seconds (0 = never)
unload_idle_after_secs = 0

[storage.persistence]
# Storage format options:
# - "parquet": Columnar format, excellent compression (10x smaller than CSV)
#              Fast reads, schema-aware, recommended for production
# - "csv":     Human-readable, uncompressed, good for debugging
# - "bincode": Binary format, Rust-specific, fast but not portable
format = "parquet"

# Compression options:
# - "snappy": Fast compression with good ratio (recommended)
# - "gzip":   Slower but better compression
# - "none":   No compression (useful for debugging)
compression = "snappy"

# Auto-save interval in seconds
# 0 = manual save only (call save_database() or save_all())
# 300 = auto-save every 5 minutes
auto_save_interval = 0

# Enable write-ahead logging (WAL) for crash recovery
enable_wal = true

# -----------------------------------------------------------------------------
# DD-Native Persist Layer (Recommended)
# -----------------------------------------------------------------------------
[storage.persist]
# Enable the DD-native persistence layer
enabled = true

# Buffer size before flushing to disk (number of updates)
buffer_size = 10000

# Durability mode: immediate, batched, async
# - immediate: Sync to disk on each write (safest, slowest)
# - batched: Periodic sync (balanced performance/safety)
# - async: Fire-and-forget (fastest, may lose recent data on crash)
# A replication follower must use immediate or batched (async is refused).
durability_mode = "immediate"

# Compaction window: retain this many historical versions (0 = keep all)
compaction_window = 0

# Auto-compact when a shard accumulates this many batch files (0 = disabled)
auto_compact_threshold = 10

# How often to check for auto-compaction, in seconds (0 = disabled)
auto_compact_interval_secs = 300

[storage.performance]
# Initial capacity for in-memory hash maps
# Higher values reduce reallocations but use more memory
initial_capacity = 10000

# Batch size for bulk insert/update operations
batch_size = 1000

# Enable async I/O for storage operations
async_io = true

# Number of worker threads (0 = use all CPU cores)
num_threads = 0

# Maximum rows in a query's final result; larger results are cut and
# flagged `truncated` (0 = unlimited)
max_result_rows = 100000

# Most rows one join of a query may be estimated to produce (0 = unlimited).
# Before a query runs, each join is estimated from the sizes of the
# relations it reads: on a shared variable as its larger input, on none (a
# cross product) as the product of its inputs, so in practice only large
# cross products go over it. Such a query is refused with `validation`
# before it runs. A plan over it is estimated again with the rows its
# filters keep of stored relations (`a(X, 7)`), and refused only if it is
# still over.
max_query_cost = 100000000

# Optional: most fixpoint iterations a recursive rule may run (default 0 =
# no limit; the deadline and memory limits already stop recursion that never
# reaches a fixpoint). Each iteration extends paths by one step; when set,
# recursion that keeps deriving new values, such as a counter without an
# upper bound, is refused with `validation` when it reaches this.
max_recursion_iterations = 0

# Most heap bytes one query may hold while it computes, summed over the
# threads evaluating it (0 = unlimited). A query that grows past it is
# refused with `resource_exhausted` and applies nothing.
max_query_memory_bytes = 4294967296

# Most heap bytes all queries running at once may hold together; a query
# that grows while they hold more is refused with `resource_exhausted`, so
# concurrent queries never push the server past its memory. Unset: 60% of
# the container's memory limit (the tightest cgroup limit on the process,
# as a container or a systemd unit's MemoryMax= sets it), or no limit
# without one; set it explicitly when graphs hold real data.
# 0 = unlimited. Stored graphs are separate from it, so size the server by:
# (graph budgets below, summed) + this + server overhead (about 0.5 GB)
# <= 0.8 x the server's memory, and keep the per-query limit at most this.
# max_total_query_memory_bytes = 8589934592

# Memory budget of each knowledge graph's stored facts (estimated from their
# tuples); writes that would grow a graph past it are refused with
# `resource_exhausted`, deletes are always accepted (0 = unlimited)
# Keep max_query_memory_bytes at least twice this budget: a query copies the
# facts it reads while it evaluates, so a whole-graph scan needs more than
# the graph's stored size.
max_graph_memory_bytes = 0

[optimization]
# Enable join spanning tree planning
# Optimizes join order for better performance
enable_join_planning = true

# Enable SIP rewriting (Yannakakis semijoin reduction)
# Filters intermediate join results early
enable_sip_rewriting = true

# Enable subplan sharing across rules
# Reuses common subexpressions to reduce computation
enable_subplan_sharing = true

# Enable boolean specialization (semiring selection)
enable_boolean_specialization = true

# Enable Magic Sets demand-driven rewriting for recursive queries
enable_magic_sets = true

[logging]
# Log level: "trace" | "debug" | "info" | "warn" | "error"
# "debug" is useful during development
# "info" is recommended for production
level = "info"

# Log format: "text" | "json"
# "text" is human-readable
# "json" is machine-parseable (useful for log aggregation)
format = "text"

# =============================================================================
# HTTP Server Configuration (WebSocket API + GUI)
# =============================================================================
#
# The HTTP server provides:
# - WebSocket API at /ws
# - AsyncAPI docs at /api/ws-docs (and YAML at /api/asyncapi.yaml)
# - Optional GUI dashboard at /

[http]
# Enable HTTP server
# When disabled, only the RPC server (QUIC+TLS) runs
enabled = true

# HTTP server bind address
# "127.0.0.1" for local access only
# "0.0.0.0" for external access
host = "127.0.0.1"

# HTTP server port
port = 8080

# Allowed CORS origins for API requests
# Empty list = allow all origins (development mode)
# Specify origins for production, e.g., ["https://myapp.com"]
cors_origins = []

# Milliseconds a WebSocket client has to authenticate
ws_auth_timeout_ms = 5000

# Milliseconds a WebSocket client may leave an outbound frame unread before
# the server closes the connection (0 = wait forever)
ws_send_timeout_ms = 30000

# Proxies (IPs or CIDR blocks) whose X-Forwarded-For / X-Real-IP headers are
# trusted for the client IP. Empty = always use the TCP peer address.
# Per-IP limits key IPv6 clients by their /64.
# trusted_proxies = ["127.0.0.1", "10.0.0.0/8"]

[http.gui]
# Enable GUI dashboard serving
# When enabled, static files from static_dir are served at /
enabled = true

# Directory containing GUI static files
# Usually the output of a Vue/React build (e.g., "./gui/dist")
static_dir = "./gui/dist"

[http.auth]
# Authentication is always enabled. On first boot, an admin user is created
# with a password from one of these sources (checked in order):
#   1. INPUTLAYER_ADMIN_PASSWORD environment variable
#   2. bootstrap_admin_password config value below
#   3. The credentials file (below), from an earlier boot
#   4. Auto-generated random password
#
# The supplied password that is used needs at least 12 characters or the
# server refuses to start on first boot (a config value overridden by the
# environment variable is ignored); once the admin exists a short one is
# ignored with a warning. An empty one counts as unset.
# A bootstrap API key is also created (INPUTLAYER_BOOTSTRAP_API_KEY, or
# generated), with the same rules for a supplied one.
# Generated secrets are saved, owner-only, to the credentials file.
# Use the key with the CLI: inputlayer-client --api-key <key>

# credentials_file = "./data/credentials.toml"  # default: <data_dir>/credentials.toml

# bootstrap_admin_password = "your-secure-password"

# Session timeout in seconds (default: 24 hours)
session_timeout_secs = 86400

# -----------------------------------------------------------------------------
# Rate Limiting
# -----------------------------------------------------------------------------
[http.rate_limit]
# Maximum concurrent connections (0 = unlimited, not recommended)
max_connections = 1024

# Maximum concurrent WebSocket connections (0 = unlimited, not recommended)
max_ws_connections = 1024

# Maximum WebSocket messages per second per connection (0 = unlimited, not recommended)
ws_max_messages_per_sec = 100

# Maximum standing-query subscriptions (.subscribe) per WebSocket connection (0 = unlimited)
ws_max_subscriptions = 64

# Maximum requests per WebSocket connection admitted and not yet answered (at least 1).
# Queries on one connection overlap up to this bound; writes, KG switches and session
# changes still run one at a time, in order. Replies always come back in request order.
ws_max_in_flight_requests = 16

# Coalescing window of a standing query in ms: commits within it share one
# evaluation, and every delta waits up to this long (0 = evaluate at once, max 100)
subscription_coalesce_ms = 0

# Maximum HTTP requests per second per IP address (0 = unlimited, not recommended)
per_ip_max_rps = 100

# Maximum unauthenticated WebSocket connections per IP address (0 = unlimited)
ws_max_preauth_per_ip = 16

# Notification ring buffer size for reconnect replay
notification_buffer_size = 4096

# =============================================================================
# STANDING QUERIES (.subscribe)
# =============================================================================
[subscriptions]
# Standing queries that differ only in bound constants (?speech("s-1", ...) and
# ?speech("s-2", ...)) share their evaluations, one at a time; each subscriber
# still gets exactly its own rows. Turns itself off per query shape when sharing
# is slower.
share_parameterized = true
# Share of the compute permits (one per core not reserved for I/O) that runs
# standing-query evaluations, between 0 and 1 exclusive; requests get the rest.
# Neither queues behind the other, but they share the CPU. Requests keep at
# least two permits (one long query never blocks every write) and evaluations
# at least one.
evaluation_share = 0.5

# =============================================================================
# WARM-STANDBY REPLICATION
# =============================================================================
[replication]
# standalone (default), primary, or follower. A primary streams every committed
# change to followers; a follower applies the stream, serves reads and
# subscriptions, and refuses writes.
role = "standalone"

# Shared secret followers present to the primary (at least 16 characters).
# Required for primary and follower. Prefer INPUTLAYER_REPLICATION__TOKEN.
# token = "..."

# Primary: bytes of recent changes kept in memory for followers to catch up
# from (default 64 MiB). A follower further behind resyncs from a checkpoint.
retain_bytes = 67108864

# Primary: heartbeat interval on an idle stream, in ms.
heartbeat_ms = 500

# Follower: the primary's HTTP base URL.
# primary_url = "http://primary:8080"

# Follower: silence from the primary after which the follower reconnects, in
# ms (detects a dead primary or a network partition). Must exceed heartbeat_ms.
timeout_ms = 3000

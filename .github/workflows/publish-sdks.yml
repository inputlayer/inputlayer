name: Publish SDKs

# Publishes the Python SDK to PyPI and the TypeScript SDK to npm.
# Parked: runs only on manual dispatch, never on tags, labels or pushes.
# Until the SDKs are published, the docs install them from a source checkout.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate: the full suite must pass before publishing
  full-suite:
    name: Full suite
    uses: ./.github/workflows/full-suite.yml

  publish-pypi:
    name: Publish to PyPI
    needs: full-suite
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/inputlayer-py
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Set dev version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BASE_VERSION=$(python -c "
          import re
          with open('pyproject.toml') as f:
              m = re.search(r'version\s*=\s*\"(.+?)\"', f.read())
              print(m.group(1))
          ")
          DEV_VERSION="${BASE_VERSION}.dev${COMMIT_COUNT}"
          echo "Publishing version: ${DEV_VERSION}"
          sed -i "s/^version = \".*\"/version = \"${DEV_VERSION}\"/" pyproject.toml

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

  publish-npm:
    name: Publish to npm
    needs: full-suite
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/inputlayer-js
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Set dev version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          DEV_VERSION="${BASE_VERSION}-dev.${SHORT_SHA}"
          echo "Publishing version: ${DEV_VERSION}"
          npm version "$DEV_VERSION" --no-git-tag-version

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

name: CI

# Fast gate: every pull request and every push to main. Format, clippy and
# the unit + integration tests, skipped entirely when a change touches no
# Rust inputs. The full suite runs only on release commits (full-suite.yml);
# CONTRIBUTING describes the policy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      # Everything the Rust build or its tests read. docs/spec is pulled in
      # by include_str!, examples/ is read by the example tests.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - 'gateway/**'
              - 'ontology-client/**'
              - 'docs/spec/**'
              - '**/Cargo.toml'
              - 'config.toml'
              - 'clippy.toml'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: make fmt-check

  # clippy --all-targets type-checks every target, so it is the cargo check.
  lint:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Run Clippy
        run: make lint

  # Skipped when the full suite covers this commit (a PR labeled `release`,
  # or one from a release/** branch of this repo), since its test job runs
  # the same cargo test.
  test:
    name: Tests (fast)
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'release') &&
      !(startsWith(github.head_ref, 'release/') &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cargo.lock is not committed, so key on the manifests. No restore-keys:
      # falling back to an older target/ would carry its artifacts forward and
      # grow the cache until the runner runs out of disk.
      - name: Cache cargo
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-fast-${{ hashFiles('**/Cargo.toml') }}

      - name: Run unit + integration tests
        run: make unit-test

name: CI

# PR gate: pull requests only. Format, clippy, supply chain and one debug
# build that runs the unit, integration, scenario and oracle tests and the
# snapshot specs the change affects, skipped entirely when a change touches
# no Rust inputs; the SDK unit suites when their inputs change. Pushes to
# main run main.yml; the full suite runs on release commits or manually on
# main. CONTRIBUTING describes the policy.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      js: ${{ steps.filter.outputs.js }}
    steps:
      - uses: actions/checkout@v4

      # Everything the Rust build or its tests read. docs/spec is pulled in
      # by include_str!, examples/ is read by the example tests.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - 'gateway/**'
              - 'ontology-client/**'
              - 'ws-protocol/**'
              - 'perf-gate/**'
              - 'vendor/**'
              - 'docs/spec/**'
              - '**/Cargo.toml'
              - 'config.toml'
              - 'clippy.toml'
              - 'Makefile'
              - 'deny.toml'
              - '.cargo/audit.toml'
              - 'scripts/run_snapshot_tests.sh'
              - 'scripts/affected-map.toml'
              - 'scripts/gen-affected-map.py'
              - 'scripts/test-timings.sh'
              - '.github/workflows/ci.yml'
            # The SDKs speak the wire protocol the engine defines, so a
            # protocol change runs their suites too.
            python:
              - 'packages/inputlayer-py/**'
              - 'packages/conformance/**'
              - 'ws-protocol/**'
              - 'docs/spec/**'
              - 'src/protocol/**'
              - '.github/workflows/ci.yml'
            js:
              - 'packages/inputlayer-js/**'
              - 'packages/conformance/**'
              - 'ws-protocol/**'
              - 'docs/spec/**'
              - 'src/protocol/**'
              - '.github/workflows/ci.yml'

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: make fmt-check

  secrets:
    name: Secret scan and hooks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan every commit, not just the tip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install pinned gitleaks
        run: make install-gitleaks

      - name: Scan history for secrets
        run: make secret-check

      - name: Hooks reject misformatted Rust and credentials
        run: make hooks-test

  # clippy --all-targets type-checks every target, so it is the cargo check.
  lint:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Run Clippy
        run: make lint

  # Supply chain: licenses, sources, banned crates and RustSec advisories.
  # No Cargo.lock is committed, so both tools check what a fresh resolve
  # pulls in today. Ignored advisories carry their reason in deny.toml.
  supply-chain:
    name: Supply chain (cargo deny, cargo audit)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      CARGO_AUDIT_VERSION: 0.22.2
      CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny and cargo-audit
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          cd "$RUNNER_TEMP"
          deny="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${deny}.tar.gz"
          echo "${CARGO_DENY_SHA256}  deny.tar.gz" | sha256sum -c -
          tar xzf deny.tar.gz
          install "${deny}/cargo-deny" "$HOME/.local/bin/"
          audit="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          curl -sSfL -o audit.tgz \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${audit}.tgz"
          echo "${CARGO_AUDIT_SHA256}  audit.tgz" | sha256sum -c -
          tar xzf audit.tgz
          install "${audit}/cargo-audit" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path perf-gate/Cargo.toml

      - name: cargo deny
        run: |
          cargo deny --locked check advisories sources licenses bans
          cargo deny --manifest-path perf-gate/Cargo.toml --locked check advisories sources licenses bans

      - name: cargo audit
        run: |
          cargo audit --deny warnings
          cargo audit --deny warnings --file perf-gate/Cargo.lock

  # One debug build serves every tier: cargo test runs the unit, integration,
  # scenario (tests/scenarios) and oracle tests and leaves the server and
  # client in target/debug, which the snapshot specs then run against.
  # Budget: 10 minutes wall on this runner.
  # Skipped when the full suite covers this commit (a PR labeled `release`,
  # or one from a release/** branch of this repo), since its test job runs
  # the same cargo test.
  test:
    name: Tests
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'release') &&
      !(startsWith(github.head_ref, 'release/') &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    # Full debuginfo on the test build fills the runner disk. Line tables keep
    # line numbers in RUST_BACKTRACE output at a fraction of the size.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR's merge commit and its parents: HEAD^1 is the base the
          # affected specs are computed against.
          fetch-depth: 2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cargo.lock is not committed, so key on the manifests. No restore-keys:
      # falling back to an older target/ would carry its artifacts forward and
      # grow the cache until the runner runs out of disk. Bump the version
      # when the build settings change so an old target/ is not restored.
      - name: Cache cargo
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-fast-v2-${{ hashFiles('**/Cargo.toml') }}

      # shell: bash adds pipefail, so tee does not hide a failing test.
      - name: Run unit, integration, scenario and oracle tests
        shell: bash
        run: make unit-test 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"

      - name: Run affected snapshot specs (debug binaries)
        run: ./scripts/run_snapshot_tests.sh --debug --skip-build --affected "$(git rev-parse HEAD^1)"

      - name: Per-binary test times
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/cargo-test.log" ] || exit 0
          ./scripts/test-timings.sh "$RUNNER_TEMP/cargo-test.log" | tee -a "$GITHUB_STEP_SUMMARY"

  # The Python SDK's unit tests, including the connection core against a
  # mock server replaying packages/conformance. The live tests run in the
  # full suite (make python-test-live), which builds the engine.
  # Runs on the oldest supported Python (requires-python in
  # packages/inputlayer-py/pyproject.toml) as well as the current one.
  python-sdk:
    name: Python SDK (${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run unit tests
        run: make python-test

  # The TypeScript SDK's unit tests (the connection core against a scripted
  # server replaying its frame fixtures) and its type check. The live tests
  # run on pushes to main (main.yml, make js-test-live).
  js-sdk:
    name: JS SDK
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/inputlayer-js/package-lock.json

      - name: Run unit tests and type check
        run: make pre-pr-js

name: CI

# Fast gate: pull requests only. Format, clippy and
# the unit + integration tests, skipped entirely when a change touches no
# Rust inputs. The full suite runs on release commits or manually on main;
# CONTRIBUTING describes the policy.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4

      # Everything the Rust build or its tests read. docs/spec is pulled in
      # by include_str!, examples/ is read by the example tests.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - 'gateway/**'
              - 'ontology-client/**'
              - 'ws-protocol/**'
              - 'perf-gate/**'
              - 'docs/spec/**'
              - '**/Cargo.toml'
              - 'config.toml'
              - 'clippy.toml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            python:
              - 'packages/inputlayer-py/**'
              - 'packages/conformance/**'
              - '.github/workflows/ci.yml'

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: make fmt-check

  secrets:
    name: Secret scan and hooks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan every commit, not just the tip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install pinned gitleaks
        run: make install-gitleaks

      - name: Scan history for secrets
        run: make secret-check

      - name: Hooks reject misformatted Rust and credentials
        run: make hooks-test

  # clippy --all-targets type-checks every target, so it is the cargo check.
  lint:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Run Clippy
        run: make lint

  # Skipped when the full suite covers this commit (a PR labeled `release`,
  # or one from a release/** branch of this repo), since its test job runs
  # the same cargo test.
  test:
    name: Tests (fast)
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'release') &&
      !(startsWith(github.head_ref, 'release/') &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    # Full debuginfo on the test build fills the runner disk. Line tables keep
    # line numbers in RUST_BACKTRACE output at a fraction of the size.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cargo.lock is not committed, so key on the manifests. No restore-keys:
      # falling back to an older target/ would carry its artifacts forward and
      # grow the cache until the runner runs out of disk. Bump the version
      # when the build settings change so an old target/ is not restored.
      - name: Cache cargo
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-fast-v2-${{ hashFiles('**/Cargo.toml') }}

      - name: Run unit + integration tests
        run: make unit-test

  # The Python SDK's unit tests, including the connection core against a
  # mock server replaying packages/conformance. The live tests run in the
  # full suite (make python-test-live), which builds the engine.
  python-sdk:
    name: Python SDK
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run unit tests
        run: make python-test

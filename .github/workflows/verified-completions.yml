name: Verified Completions gate

# Deterministic false-alarm/revision gate (issue #88): corpus scenarios,
# controls included, and recorded reference extractions through the rule
# pack on a throwaway engine. No model calls, so it runs on every PR that
# can change what the pack reports: the pack and prompts, the corpus and
# evaluator, gateway ingestion, and the Python client the replay drives.
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/internals/verified-completions/rules/**"
      - "docs/internals/verified-completions/extraction/**"
      - "docs/internals/verified-completions/poc/**"
      - "gateway/src/**"
      - "packages/inputlayer-py/src/**"
      - "scripts/run_vc_gate.sh"
      - ".github/workflows/verified-completions.yml"
  push:
    branches: [main]
    paths:
      - "docs/internals/verified-completions/rules/**"
      - "docs/internals/verified-completions/extraction/**"
      - "docs/internals/verified-completions/poc/**"
      - "gateway/src/**"
      - "packages/inputlayer-py/src/**"
      - "scripts/run_vc_gate.sh"
      - ".github/workflows/verified-completions.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: False-alarm / revision gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ runner.os }}-cargo-vc-gate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-vc-gate-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run gate
        run: make vc-gate

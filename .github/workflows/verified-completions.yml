name: Verified Completions gate

# Deterministic false-alarm/revision gate (issue #88): corpus scenarios,
# controls included, and recorded reference extractions through the rule
# pack on a throwaway engine. No model calls. It runs only at release
# checkpoints, never on ordinary PR updates or after merge: on a PR carrying
# the `release` label, on release/** branches, on v* tags, or on demand.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  push:
    branches: ["release/**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: False-alarm / revision gate
    # Pull requests run it only once they carry the release label.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ runner.os }}-cargo-vc-gate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-vc-gate-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run gate
        run: make vc-gate

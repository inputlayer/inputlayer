name: Full suite

# Everything the fast gate (ci.yml) leaves out, run at release checkpoints:
#   - pushes to a release/** branch
#   - pull requests labeled `release` (when the label is added, then on
#     every push while it stays). A PR from a release/** branch of this repo
#     is already covered by the branch push, so its PR run is skipped.
#   - manual workflow_dispatch on main only, or with perf_gate_only on any
#     ref, which runs the performance runs alone, the gate and the views
#     benchmark (to measure a branch)
#   - v* tag pushes, through the Release workflow (publish.yml), which calls
#     this workflow and publishes only if it passes
# docker.yml uses the release triggers without manual dispatch.
# CONTRIBUTING describes the policy.

on:
  push:
    branches: ['release/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      perf_gate_only:
        description: Run only the performance gate and the views benchmark (allowed on any ref)
        type: boolean
        default: false
      perf_gate_aa:
        description: Measure the baseline against itself (the runner's noise check)
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

# Adding an unrelated label gets a run of its own, so it cannot cancel an
# in-progress full suite on the same PR.
concurrency:
  group: full-suite-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'release') && github.run_id || 'run' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: Release commit
    if: >-
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || inputs.perf_gate_only) &&
      (github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'release') &&
       (github.event.action != 'labeled' || github.event.label.name == 'release') &&
       !(startsWith(github.head_ref, 'release/') &&
         github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release commit, running the full suite"

  test:
    name: Tests (full)
    needs: gate
    if: ${{ !inputs.perf_gate_only }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Clean stale debug artifacts
        run: rm -rf target/debug 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python SDK dependencies
        run: pip install -e "packages/inputlayer-py[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run all tests (CI mode)
        run: make ci-test-all

  docs:
    name: Documentation
    needs: gate
    if: ${{ !inputs.perf_gate_only }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Check documentation
        run: make doc-check

  website:
    name: Website
    needs: gate
    if: ${{ !inputs.perf_gate_only }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Build website
        working-directory: front
        run: npm run build

      - name: Upload website
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: front/dist
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: gate
    if: ${{ !inputs.perf_gate_only }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      # Registry only: Cargo.lock is not committed, so the key never changes
      # and a cached target/ grew until the runner ran out of disk.
      - name: Cache cargo
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-coverage-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-v2-

      - name: Generate coverage report
        run: make coverage

      - name: Coverage summary
        run: make view-coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/coverage/
          retention-days: 14

  python-langchain-live:
    name: Python langchain integration (live server)
    needs: gate
    if: ${{ !inputs.perf_gate_only }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ runner.os }}-cargo-py-live-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-py-live-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Python dev dependencies
        working-directory: packages/inputlayer-py
        run: uv sync --extra dev

      - name: Run langchain integration tests against a live server
        run: make python-test-live

      - name: Run langchain examples against a live server
        run: make python-test-examples

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inputlayer-server-log
          path: /tmp/il_python_*_server.log
          if-no-files-found: ignore
          retention-days: 7

  js-sdk-live:
    name: JS SDK query examples (live server)
    needs: gate
    if: ${{ !inputs.perf_gate_only }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ runner.os }}-cargo-js-live-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-js-live-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the JS SDK guide's query examples against a live server
        run: make js-test-live

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inputlayer-js-live-server-log
          path: /tmp/il_js_live_server.log
          if-no-files-found: ignore
          retention-days: 7

  python-sdk-live:
    name: Python SDK query examples (live server)
    needs: gate
    if: ${{ !inputs.perf_gate_only }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ runner.os }}-cargo-py-sdk-live-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-py-sdk-live-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run the Python SDK guide's query examples against a live server
        run: make python-sdk-live

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inputlayer-py-sdk-live-server-log
          path: /tmp/il_py_sdk_live_server.log
          if-no-files-found: ignore
          retention-days: 7

  # Lint and unit-test the performance gate tool.
  perf-gate-tool:
    name: Performance gate tool
    needs: gate
    if: ${{ !inputs.perf_gate_only }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy and unit tests
        run: make perf-gate-check

  # The performance gate itself: the approved baseline against this commit,
  # both built in release mode and measured interleaved on this one runner,
  # so the runner's speed cancels out of the paired ratios. FAIL or
  # INVALID fails the checkpoint; INCONCLUSIVE is retried once with more
  # rounds, then reported as a warning (scripts/perf-gate-ci.sh,
  # perf-gate/README.md). The checkpoint's heavy runs (the gate and the
  # engine suite) also go to the dedicated benchmark host:
  # make perf-gate-remote / make bench-engine-remote (perf-gate/README.md).
  perf-gate:
    name: Performance gate
    needs: gate
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # The baseline commit is built from git archive.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Toolchain key
        id: toolchain
        run: echo "key=$(rustc -V | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Baseline servers are cached per commit and toolchain, as the gate
      # caches them locally; the candidate is always built fresh.
      - name: Cache baseline server
        uses: useblacksmith/cache@v5
        with:
          path: target/perf-gate/servers
          key: perf-gate-baseline-${{ hashFiles('perf-gate/baselines/approved.toml') }}-${{ steps.toolchain.outputs.key }}

      - name: Pin the CPU frequency governor
        run: |
          shopt -s nullglob
          govs=(/sys/devices/system/cpu/cpu*/cpufreq/scaling_governor)
          if [ ${#govs[@]} -gt 0 ]; then
            echo performance | sudo tee "${govs[@]}" > /dev/null || true
          fi
          if [ -e /sys/devices/system/cpu/cpufreq/boost ]; then
            echo 0 | sudo tee /sys/devices/system/cpu/cpufreq/boost > /dev/null || true
          fi
          nproc; lscpu | grep -E 'Model name|^CPU\(s\)|MHz' || true
          cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || echo "governor: not exposed (virtual machine)"

      - name: Run the performance gate
        run: scripts/perf-gate-ci.sh ${{ inputs.perf_gate_aa && '--aa' || '' }}

      - name: Upload the samples and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-runs
          path: |
            target/perf-gate/runs/*/run.json
            target/perf-gate/runs/*/report.md
            target/perf-gate/runs/*/verdict.json
          if-no-files-found: ignore
          retention-days: 30

  # The views benchmark (perf-gate views, #308): write and read cost against
  # deployed rules by graph size, rule count and subscriber count, with the
  # engine's view work counters. Part of the performance runs (it runs with
  # perf_gate_only too) and report-only: it fails only when a delta never
  # arrives or a step fails, never on latency. Numbers comparable with the
  # incremental-views review come from the benchmark host:
  # make bench-views-remote (perf-gate/README.md).
  views-bench:
    name: Views benchmark
    needs: gate
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run the views benchmark
        run: scripts/bench-views.sh --server-cpus 8-31

      - name: Summary
        if: always()
        run: cat target/bench-views/latest/summary.md >> "$GITHUB_STEP_SUMMARY" 2> /dev/null || true

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: views-bench
          path: |
            target/bench-views/runs/*/result.json
            target/bench-views/runs/*/summary.md
          if-no-files-found: ignore
          retention-days: 30

  # Verified Completions false-alarm/revision gate (issue #88): corpus
  # scenarios, controls included, and recorded reference extractions through
  # the rule pack on a throwaway engine. No model calls.
  verified-completions:
    name: Verified Completions gate
    needs: gate
    if: ${{ !inputs.perf_gate_only }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ runner.os }}-cargo-vc-gate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-vc-gate-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run gate
        run: make vc-gate

  msrv:
    name: Minimum Supported Rust Version
    needs: gate
    if: ${{ !inputs.perf_gate_only }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Check MSRV
        run: cargo check --all-features

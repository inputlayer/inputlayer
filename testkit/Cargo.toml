[package]
name = "inputlayer-testkit"
version = "0.1.0"
edition = "2021"
description = "Test-only harness: real engine processes, WebSocket agent clients, reactive fixtures and delta-latency samples"
license = "Elastic-2.0"
repository = "https://github.com/inputlayer/inputlayer"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1.0"
futures-util = "0.3"
inputlayer-ws-protocol = { path = "../ws-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.0"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.24"
toml = "0.8"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"

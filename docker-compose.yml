services:
  inputlayer:
    image: ghcr.io/inputlayer/inputlayer:latest
    restart: unless-stopped
    volumes:
      - inputlayer-data:/var/lib/inputlayer/data
    environment:
      INPUTLAYER_ADMIN_PASSWORD: ${INPUTLAYER_ADMIN_PASSWORD:-}
      INPUTLAYER_BOOTSTRAP_API_KEY: ${INPUTLAYER_BOOTSTRAP_API_KEY:-}
      INPUTLAYER_HTTP__HOST: "0.0.0.0"
      # The engine fetches ontology packs on .ontology install. HTTPS index
      # URL, or a local path (mount a registry clone) for deployments with
      # no outbound network.
      INPUTLAYER_REGISTRY: ${INPUTLAYER_REGISTRY:-}
      INPUTLAYER_REGISTRY_TOKEN: ${INPUTLAYER_REGISTRY_TOKEN:-}
      INPUTLAYER_HTTP__PORT: "8080"
      INPUTLAYER_HTTP__CORS_ALLOW_ALL: "false"
      INPUTLAYER_LOGGING__LEVEL: ${INPUTLAYER_LOG_LEVEL:-info}
    # NOT exposed to host - only accessible via Caddy

  # The model gateway: OpenAI-compatible Verified Completions API.
  # Separate deployable with its own configuration; the engine never sees
  # the model provider key. Caddy routes /v1/chat/completions, /v1/events,
  # and /v1/ontologies here. Remove this service if you only want the engine.
  gateway:
    image: ghcr.io/inputlayer/inputlayer-gateway:latest
    restart: unless-stopped
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8081"
      INPUTLAYER_URL: "http://inputlayer:8080"
      INPUTLAYER_API_KEY: ${INPUTLAYER_BOOTSTRAP_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # REQUIRED here: this compose file publishes the gateway to the
      # internet via Caddy, and an unauthenticated gateway spends your
      # model-provider budget for anyone who finds it. Compose refuses to
      # start without it. (The no-TLS compose, meant for local/private
      # networks, leaves it optional.)
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?GATEWAY_API_KEY is required for the public TLS deployment - clients authenticate with Authorization Bearer}
      # Every ontology published in the registry index is loaded at startup
      # and pinned by version and digest; each request selects one via the
      # x-il-ontology header. INPUTLAYER_REGISTRY overrides the index location and
      # INPUTLAYER_REGISTRY_TOKEN is needed while the registry is private.
      INPUTLAYER_REGISTRY: ${INPUTLAYER_REGISTRY:-}
      INPUTLAYER_REGISTRY_TOKEN: ${INPUTLAYER_REGISTRY_TOKEN:-}
    volumes:
      # Persist the ontology cache so container recreation does not depend
      # on the registry being reachable.
      - gateway-cache:/var/lib/inputlayer
    depends_on:
      - inputlayer
    # NOT exposed to host - only accessible via Caddy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - inputlayer
      - gateway

volumes:
  inputlayer-data:
  gateway-cache:
  caddy-data:
  caddy-config:
